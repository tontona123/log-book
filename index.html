function requestForm(caseId){const c=state.cases.find(x=>x.id===caseId);const selected=new URLSearchParams(location.hash.split('?')[1]||'').get('form')||'epa1';return head('ขอรับการประเมิน','เลือกแบบประเมินและอาจารย์ที่สังเกตการทำหัตถการ',btn('กลับรายการคำขอ','requests','arrow'))+`<div class="grid main-side"><div class="card pad"><form onsubmit="saveRequest(event,'${c?.id||''}')"><div class="form-grid">${field('แบบประเมิน *','form',select('form',FORMS.filter(f=>['EPA','DOPS'].includes(f.type)).map(f=>[f.id,`${f.id.toUpperCase()} · ${f.title}`]),selected,true),'ชั้นปีและเกณฑ์ใช้ข้อมูลจากเอกสารเดิมเพื่อสาธิต',true)}${field('วันที่ทำหัตถการ *','date',input('date',c?.date||TODAY,'date','required'))}${field('อาจารย์ผู้ประเมิน *','evaluator',select('evaluator',assessorNames(),activeInstructorName(),true))}${field('รหัสเคสตัวอย่าง','caseRef',input('caseRef',c?.caseRef||'','text','placeholder="DEMO-00123"'),'ไม่ใช้ HN จริง')}${field('วันครบกำหนดตัวอย่าง *','due',input('due','2026-09-23','date','required'))}${field('สิ่งที่ต้องการรับคำแนะนำ','message',textArea('message'),'ข้อมูลนี้ส่งให้อาจารย์พร้อมคำขอ',true)}</div><div class="form-actions">${btn('ยกเลิก','requests','')}<button class="btn primary" type="submit">${icon('check')}ส่งคำขอตัวอย่าง</button></div></form></div><div><div class="card pad"><h2>ก่อนขอรับการประเมิน</h2><div class="mini-list"><div>เลือกแบบให้ตรงกับหัตถการ</div><div>เลือกอาจารย์ที่เป็นผู้ประเมินจริง</div><div>ทบทวนผลครั้งก่อนและ Feedback</div></div><p class="small muted section-gap">เอกสารกำหนดอย่างน้อย 2 ครั้งกับอาจารย์คนละท่าน รายละเอียดการนับและวันครบกำหนดยังต้องยืนยัน</p></div><div class="section-gap">${info('ต้นแบบจะสร้างรายการในเครื่องนี้และแสดงตัวอย่างการแจ้งเตือน ไม่มีการส่ง Email หรือ LINE จริง')}</div></div></div>`;}
function saveRequest(e,caseId){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(d.due<d.date){toast('วันครบกำหนดต้องไม่ก่อนวันที่ทำหัตถการ');return}const f=formById(d.form);const r={...d,createdDate:TODAY,id:'A'+Date.now(),form:f.id,type:f.type,title:f.title,name:currentStudent(),year:'R1',status:'pending',caseId};state.requests.unshift(r);recordAudit('สร้างคำขอประเมินตัวอย่าง '+f.id.toUpperCase());location.hash='request/'+r.id;toast('สร้างคำขอตัวอย่างแล้ว สามารถเปลี่ยนมุมมองอาจารย์เพื่อประเมินได้')}
function requestDetail(id){const r=state.requests.find(x=>x.id===id);if(!r)return notFound();const a=state.assessments.find(x=>x.request===id);return head('รายละเอียดคำขอประเมิน',`${esc(r.id)} · ${esc(r.title)}`,btn('กลับคำขอ','requests','arrow'))+`<div class="grid main-side"><div class="card pad"><div class="actions">${tag(r.type,'blue')}${statusTag(r.status==='pending'?'รอประเมิน':r.status==='done'?'ประเมินแล้ว':'ยกเลิก')}</div><h2 style="margin-top:20px">${esc(r.title)}</h2><dl class="kv section-gap"><dt>ผู้เรียน</dt><dd>${esc(r.name)} · ${r.year}</dd><dt>วันที่ทำหัตถการ</dt><dd>${dateThai(r.date)}</dd><dt>ผู้ประเมิน</dt><dd>${esc(r.evaluator||activeInstructorName())}</dd><dt>ครบกำหนดตัวอย่าง</dt><dd>${dateThai(r.due)}</dd><dt>ข้อความถึงอาจารย์</dt><dd>${esc(r.message||'ไม่มีข้อความเพิ่มเติม')}</dd></dl><div class="form-actions">${r.status==='pending'?`<button class="btn danger" onclick="cancelRequest('${r.id}')">ยกเลิกคำขอ</button><button class="btn primary" onclick="goAs('instructor','evaluate/${r.id}')">ทดลองประเมินในมุมอาจารย์</button>`:a?btn('ดูผลประเมิน',`assessment/${a.id}`,'check','primary'):''}</div></div><div class="card pad"><h2>เส้นทางคำขอ</h2><div class="timeline section-gap"><div class="timeline-item"><span class="timeline-dot"></span><div>ส่งคำขอแล้ว<p>${dateThai(r.createdDate||r.date)}</p></div></div><div class="timeline-item"><span class="timeline-dot"></span><div>${r.status==='pending'?'รออาจารย์ประเมิน':r.status==='done'?'บันทึกผลแล้ว':'ยกเลิกคำขอแล้ว'}<p>สถานะในต้นแบบ</p></div></div></div></div></div>`;}
function cancelRequest(id){confirmDialog('ยกเลิกคำขอประเมิน','รายการนี้จะเปลี่ยนเป็นสถานะยกเลิก โดยยังคงประวัติไว้',()=>{const r=state.requests.find(r=>r.id===id);r.status='cancelled';recordAudit('ยกเลิกคำขอตัวอย่าง');render();toast('ยกเลิกคำขอแล้ว')})}
function assessmentForm(id,preview=false){const req=preview?null:state.requests.find(r=>r.id===id);const f=formById(preview?id:req?.form);if(!f)return notFound();if(req?.status==='done'){const a=state.assessments.find(a=>a.request===req.id);return head('รายการนี้ประเมินแล้ว')+info('ดูผลที่บันทึกไว้ได้ในประวัติการประเมิน')+btn('ดูผลประเมิน',`assessment/${a?.id}`,'check','primary')}if(req?.status==='cancelled')return head('คำขอนี้ถูกยกเลิกแล้ว')+btn('กลับงานรอประเมิน','queue','arrow');const draft=state.drafts?.[id];const isNumeric=f.type==='Long case';return head(`${f.type} · ${esc(f.title)}`,`${f.items.length} หัวข้อประเมิน ${f.year?'· '+esc(f.year)+' ตามเอกสารเดิม':''}`,btn(preview?'กลับคลังแบบประเมิน':'กลับรายการงาน',preview?'forms':'queue','arrow'))+info(preview?'ทดลองกรอกแบบประเมินจากหัวข้อในเอกสารเดิม ผลที่บันทึกเป็นข้อมูลสมมติในเบราว์เซอร์เครื่องนี้':'บันทึกผลรายข้อและข้อเสนอแนะให้ครบ ผลแต่ละครั้งจะเก็บแยกจากประวัติก่อนหน้า')+(f.type==='FEV-1'?info('FEV-1 ใช้คะแนนรายข้อ 0–4 ในเอกสารเดิม ต้นแบบยังไม่ตัดสินผ่าน/ไม่ผ่านจากคะแนนรวม','warning'):f.type==='DOPS'?info('เกณฑ์ในหัวแบบเดิม: ผ่านเมื่อทำถูกต้องสมบูรณ์ครบทุกข้อ หากผลรวมต่างจากรายข้อ ต้องบันทึกเหตุผลให้ชัดเจน','warning'):['EPA','Skill Board'].includes(f.type)?info('คะแนนรายข้อและ Level โดยรวมเป็นคนละส่วน ไม่มีการแปลงคะแนนเฉลี่ยเป็น Level โดยอัตโนมัติ'):info(f.type==='Glaucoma club'?'แสดงหัวข้อจากแบบเดิม บันทึกเป็นข้อความระหว่างรอยืนยันสเกลและเกณฑ์ผ่าน':'เก็บคะแนนตามหัวข้อเดิม เกณฑ์ผ่านและข้อที่ไม่ระบุคะแนนเต็มยังรอการยืนยัน','warning'))+`<form id="assessment-form" onsubmit="submitAssessment(event,'${f.id}','${req?.id||''}')"><div class="card pad"><h2>ข้อมูลการประเมิน</h2><div class="form-grid section-gap">${field('แพทย์ประจำบ้าน','residentName',input('residentName',draft?.residentName||req?.name||currentStudent(),'text','required'))}${field('ผู้ประเมิน','assessor',select('assessor',assessorNames(),draft?.assessor||req?.evaluator||activeInstructorName(),true))}${field('วันที่ประเมิน','assessedDate',input('assessedDate',draft?.assessedDate||TODAY,'date','required'))}${field('รูปแบบ','formType',input('formType',f.id.toUpperCase(),'text','readonly'))}</div></div><div class="card pad section-gap"><div class="toolbar"><h2>หัวข้อการประเมิน</h2><span class="tag gray">${f.items.length} ข้อ</span></div>${f.items.map((item,i)=>{const choices=item.choices||f.itemChoices;const label=esc(item.label).replace(/\*\*/g,'');return `<fieldset class="rubric-item" style="border:0;border-bottom:1px solid var(--line);margin:0;padding-left:0;padding-right:0"><legend class="rubric-label"><span class="item-number">${i+1}</span><span>${label}</span></legend><div class="rubric-choices">${choices?choices.map((ch,j)=>`<label class="choice"><input type="radio" name="item${i}" value="${esc(ch)}" ${String(draft?.['item'+i])===String(ch)?'checked':''} required><span>${esc(ch)}</span></label>`).join(''):isNumeric?`<label class="small">คะแนน ${item.max!=null?'(เต็ม '+item.max+')':'(ยังไม่ระบุคะแนนเต็ม)'} <input style="width:115px;margin-left:8px" class="input" type="number" name="item${i}" min="0" ${item.max!=null?`max="${item.max}"`:''} step="0.5" required value="${esc(draft?.['item'+i]||'')}" aria-label="คะแนนข้อ ${i+1}"></label>`:`<input class="input" name="item${i}" required placeholder="บันทึกข้อสังเกตของขั้นตอนนี้" aria-label="ข้อสังเกตข้อ ${i+1}" value="${esc(draft?.['item'+i]||'')}"><span class="small muted">บันทึกเป็นข้อความระหว่างรอยืนยันสเกลรายข้อ</span>`}</div></fieldset>`}).join('')}</div><div class="card pad section-gap"><h2>สรุปผลและคำแนะนำ</h2><div class="form-grid section-gap">${f.overall?.choices?.length?field('ผลโดยรวม *','overall',select('overall',[['','เลือกผลโดยรวม'],...f.overall.choices],draft?.overall||'',true),'เลือกผลโดยผู้ประเมิน ไม่คำนวณแทนการตัดสินใจ',true):''}${field('Feedback / คำแนะนำ *','feedback',textArea('feedback',draft?.feedback||'','required placeholder="จุดที่ทำได้ดี สิ่งที่ควรฝึกเพิ่มเติม และแนวทางพัฒนา"'),'',true)}${f.type==='DOPS'?field('เหตุผลประกอบ หากผลโดยรวมแตกต่างจากรายข้อ','override',textArea('override',draft?.override||''),'ต้นแบบจะให้ระบุเหตุผลเมื่อเลือกผ่านแต่มีข้อที่ยังไม่สมบูรณ์',true):''}${field('ได้ทบทวนร่วมกับผู้เรียน','reviewed',select('reviewed',['ได้ทบทวนแล้ว','ยังไม่ได้ทบทวน'],draft?.reviewed||'ได้ทบทวนแล้ว'))}${field('Self-reflection ของผู้เรียน','reflectionDone',select('reflectionDone',['ได้สะท้อนการเรียนรู้แล้ว','ยังไม่ได้สะท้อนการเรียนรู้'],draft?.reflectionDone||'ได้สะท้อนการเรียนรู้แล้ว'))}</div><div class="form-actions"><button class="btn" type="button" onclick="saveAssessmentDraft('${id}')">บันทึกร่างในเครื่อง</button><button class="btn primary" type="submit">${icon('check')}บันทึกผลประเมินตัวอย่าง</button></div></div></form>`;}
function saveAssessmentDraft(id){const f=document.getElementById('assessment-form');state.drafts=state.drafts||{};state.drafts[id]=Object.fromEntries(new FormData(f));persist();toast('บันทึกร่างในเบราว์เซอร์แล้ว กลับมาเปิดแบบนี้ต่อได้')}
function submitAssessment(e,formId,requestId){e.preventDefault();const f=formById(formId);const d=Object.fromEntries(new FormData(e.target));if(f.type==='DOPS'&&d.overall==='ผ่าน'&&f.items.some((_,i)=>d['item'+i]!==f.itemChoices[0])&&!d.override?.trim()){toast('มีรายข้อที่ยังไม่สมบูรณ์ กรุณาระบุเหตุผลประกอบผลผ่าน');document.getElementById('override')?.focus();return}let result=d.overall||(f.type==='Glaucoma club'?'บันทึกข้อสังเกตแล้ว':'บันทึกคะแนนแล้ว');if(result.startsWith('Level'))result=result.split(':')[0];if(f.type==='Long case'){const sum=f.items.reduce((n,_,i)=>n+Number(d['item'+i]),0);result=`${sum}${f.overall?.max?' / '+f.overall.max:''} คะแนน`}const id='E'+Date.now();state.assessments.unshift({id,request:requestId,form:formId,name:d.residentName,year:state.requests.find(r=>r.id===requestId)?.year||'R1',date:d.assessedDate,evaluator:d.assessor,result,feedback:d.feedback,answers:d,override:d.override||''});if(requestId){const r=state.requests.find(r=>r.id===requestId);r.status='done'}if(state.drafts)delete state.drafts[requestId||formId];recordAudit('บันทึกผลประเมินตัวอย่าง '+formId.toUpperCase());location.hash='assessment/'+id;toast('บันทึกผลประเมินแล้ว ประวัติครั้งก่อนยังคงอยู่')}
function historyPage(){const list=state.assessments.filter(a=>role!=='resident'||a.name===currentStudent());return head('ประวัติการประเมิน','ผลประเมินแต่ละครั้งและคำแนะนำจากอาจารย์',`<button class="btn" onclick="exportAssessments()">${icon('download')}ส่งออก CSV</button>`)+filters('ค้นหาชื่อหรือแบบประเมิน',select('list-filter',[['','ทุกประเภท'],['EPA','EPA'],['DOPS','DOPS'],['FEV-1','FEV-1'],['Long case','Long case'],['Skill Board','Skill Board']],'',false,'onchange="filterRows()"'))+filterableTable(['วันที่ประเมิน','ผู้เรียน / แบบประเมิน','ผู้ประเมิน','ผล',''],list.map(a=>`<tr data-filter-row data-category="${formById(a.form)?.type}"><td>${dateThai(a.date)}</td><td>${esc(a.name)}<div class="secondary">${a.form.toUpperCase()} · ${esc(formTitle(a.form))}</div></td><td>${esc(a.evaluator)}</td><td>${statusTag(displayResult(a))}</td><td>${btn('ดูผลและ Feedback',`assessment/${a.id}`,'','small')}</td></tr>`).join(''));}
function assessmentDetail(id){const a=state.assessments.find(x=>x.id===id);if(!a)return notFound();const f=formById(a.form);return head('ผลการประเมิน',`${a.form.toUpperCase()} · ${esc(formTitle(a.form))}`,btn('กลับประวัติ','history','arrow')+`<button class="btn" onclick="window.print()">${icon('download')}พิมพ์ / บันทึก PDF</button>`)+`<div class="grid main-side"><div class="card pad"><div class="actions">${tag(f.type,'blue')}${statusTag(displayResult(a))}</div><dl class="kv section-gap"><dt>แพทย์ประจำบ้าน</dt><dd>${esc(a.name)} · ${a.year}</dd><dt>วันที่ประเมิน</dt><dd>${dateThai(a.date)}</dd><dt>ผู้ประเมิน</dt><dd>${esc(a.evaluator)}</dd><dt>รหัสผลประเมิน</dt><dd>${esc(a.id)}</dd></dl><h2 class="section-gap">Feedback จากอาจารย์</h2><p style="margin-top:12px;white-space:pre-wrap">${esc(a.feedback)}</p>${a.override?`<h3 class="section-gap">เหตุผลประกอบผลโดยรวม</h3><p class="small muted">${esc(a.override)}</p>`:''}</div><div><div class="card pad"><h2>การติดตามครั้งถัดไป</h2><p class="small muted section-gap">ทบทวนคำแนะนำและเตรียมความพร้อมก่อนขอประเมินครั้งต่อไป ระบบเก็บผลทุกครั้งแยกกัน</p><div class="section-gap">${['EPA','DOPS'].includes(f.type)?btn('ขอประเมินอีกครั้ง',`new-request?form=${f.id}`,'plus','primary'):btn('ดูความก้าวหน้า','progress','chart')}</div></div></div></div><div class="section-gap">${card('รายละเอียดรายข้อ',scoreVisible()?(Object.keys(a.answers||{}).length?table(['หัวข้อ','ผลประเมิน'],f.items.map((it,i)=>`<tr><td style="white-space:normal;max-width:700px">${i+1}. ${esc(it.label)}</td><td style="white-space:normal">${esc(a.answers['item'+i]??'ยังไม่มีข้อมูล')}</td></tr>`).join('')):empty('ยังไม่มีรายละเอียดรายข้อในรายการตัวอย่างนี้','ทดลองกรอกแบบประเมินเพื่อดูผลรายข้อครบถ้วน',btn('เปิดแบบตัวอย่าง',`form/${f.id}`,'file','small'))):`<div class="card-body">${info('มุมมองผู้เรียนแสดงสถานะและ Feedback ตามการตั้งค่าตัวอย่าง คะแนนรายข้อและ Level ดูได้ในมุมอาจารย์หรือผู้ดูแล')}</div>`)}</div>`;}
function formsPage(type=''){const allowed=['EPA','DOPS','FEV-1','Long case','Skill Board','Glaucoma club'];const current=allowed.includes(type)?type:'';const forms=FORMS.filter(f=>!current||f.type===current);return head('แบบประเมินทั้งหมด','28 แบบ · 425 หัวข้อจากเอกสารเดิม ใช้สำหรับพิจารณาและทดลองกรอก',btn('เกณฑ์ที่ต้องยืนยัน','about','file'))+`<nav class="tabs" aria-label="ประเภทแบบประเมิน">${[['','ทั้งหมด'],...allowed.map(t=>[t,t])].map(([id,l])=>`<a href="#forms/${encodeURIComponent(id)}" class="${current===id?'active':''}">${l}</a>`).join('')}</nav>`+info('ชั้นปีที่แสดงอิงชื่อแบบเดิม และอาจต่างจากผังหลักสูตรบางรุ่น ต้องยืนยันก่อนใช้งานจริง')+`<div class="grid three">${forms.map(f=>`<article class="card catalog-card"><div class="catalog-top">${tag(f.id.toUpperCase(),f.type==='EPA'?'teal':f.type==='DOPS'?'blue':'gray')}<span class="small muted">${f.year||'ตาม Rotation'}</span></div><h2>${esc(f.title)}</h2><p>${f.items.length} หัวข้อ · ${f.type==='FEV-1'?'คะแนนรายข้อ 0–4':f.type==='DOPS'?'Checklist + ผ่าน / ไม่ผ่าน':f.type==='EPA'?'Rubric + Level 1–5':f.type==='Long case'?'คะแนนรายหัวข้อ':f.type==='Glaucoma club'?'หัวข้อการอภิปรายและ Feedback':'ความก้าวหน้าและ Level'}</p><div class="actions">${btn('ดูและทดลองกรอก',`form/${f.id}`,'file','small')}</div></article>`).join('')}</div>`;}
function progressPage(){return head('ความก้าวหน้าการฝึกอบรม','ดูจำนวนหัตถการและผลประเมินแยกกัน',`<button class="btn" onclick="exportProgress()">${icon('download')}ส่งออกข้อมูล</button>`)+`<div class="tabs"><a class="active" href="#progress">จำนวนหัตถการ</a><a href="#competencies">EPA / DOPS</a><a href="#history">ประวัติผลประเมิน</a></div>`+info('จำนวนขั้นต่ำ 30 รายการอิงตารางเดิม ต้องเลือกเกณฑ์ที่รับรองแล้วตามรุ่นก่อนใช้ตัดสินความครบถ้วนจริง')+`<div class="card">${table(['หัตถการ','ทำแล้ว / ขั้นต่ำ','ความคืบหน้า','ยังขาด'],ACTIVITIES.map(([n,min],i)=>{const count=state.cases.filter(c=>+c.activity===i).length;return `<tr><td>${i+1}. ${n}</td><td><strong>${count}</strong> / ${min}</td><td style="min-width:170px"><div class="progress"><span style="width:${Math.min(100,count/min*100)}%"></span></div></td><td>${count>=min?tag('ครบจำนวน','teal'):tag((min-count)+' เคส','orange')}</td></tr>`}).join(''))}</div>`;}
function competenciesPage(){const fs=FORMS.filter(f=>['EPA','DOPS'].includes(f.type));return head('ความก้าวหน้า EPA / DOPS','ติดตามผลแต่ละครั้งและจำนวนอาจารย์ผู้ประเมิน',btn('ขอรับการประเมิน','new-request','plus','primary'))+`<div class="tabs"><a href="#progress">จำนวนหัตถการ</a><a class="active" href="#competencies">EPA / DOPS</a><a href="#history">ประวัติผลประเมิน</a></div>`+info('เอกสารกำหนดอย่างน้อย 2 ครั้งกับอาจารย์คนละท่าน การนับเฉพาะครั้งที่ผ่าน เกณฑ์ Level และช่วงเวลายังต้องยืนยัน หน้านี้จึงแสดงหลักฐานที่มีโดยไม่ตัดสินผ่านหลักสูตร','warning')+`<div class="card">${table(['รายการ','ประเมินแล้ว','อาจารย์ต่างคน','ผลล่าสุด',''],fs.map(f=>{const as=state.assessments.filter(a=>a.form===f.id&&a.name===currentStudent());return `<tr><td>${tag(f.id.toUpperCase(),'blue')} <span>${esc(f.title)}</span></td><td>${as.length} ครั้ง</td><td>${new Set(as.map(a=>a.evaluator)).size} คน</td><td>${as.length?statusTag(displayResult(as[0])):tag('ยังไม่มีผล')}</td><td>${btn('ดูแบบ',`form/${f.id}`,'','small')}</td></tr>`}).join(''))}</div>`;}

function activityList(type){if(!ACTIVITY_TYPES[type])return notFound();const forms=type==='longcase'?FORMS.filter(f=>f.type==='Long case'):type==='skillboard'?FORMS.filter(f=>f.type==='Skill Board'):[];const acts=state.activities.filter(a=>a.type===type);return head(ACTIVITY_TYPES[type],type==='skillboard'?'บันทึกพัฒนาการจากการฝึกและ Feedback ร่วมกับอาจารย์':'บันทึกหลักฐานและติดตามการเรียนรู้',btn('กลับ E-Portfolio','portfolio','arrow')+btn('เพิ่มบันทึก',`activity-new/${type}`,'plus','primary'))+(forms.length?`<div class="grid ${forms.length===4?'two':'three'}">${forms.map(f=>`<div class="card catalog-card">${tag(f.type,'teal')}<h2>${esc(f.title)}</h2><p>${f.items.length} หัวข้อ · ${f.year||'ตามแผนฝึก'}</p>${btn('เปิดแบบประเมิน',`form/${f.id}`,'file','small')}</div>`).join('')}</div>`:'')+`<section class="card section-gap"><div class="card-head"><h2>บันทึกของฉัน</h2><span class="small muted">${acts.length} รายการ</span></div>${acts.length?table(['วันที่','หัวข้อ','สถานะ',''],acts.map(a=>`<tr><td>${dateThai(a.date)}</td><td>${esc(a.title)}</td><td>${statusTag(a.status)}</td><td>${btn('รายละเอียด',`activity/${a.id}`,'','small')}</td></tr>`).join('')):empty('ยังไม่มีบันทึก'+ACTIVITY_TYPES[type],'เพิ่มกิจกรรมหรือเปิดแบบประเมินเพื่อเริ่มทดลองใช้งาน',btn('เพิ่มบันทึก',`activity-new/${type}`,'plus','primary'))}</section>`;}
function activityForm(type,id){const a=state.activities.find(x=>x.id===id);if(a)type=a.type;if(!ACTIVITY_TYPES[type])return notFound();let extras='';if(type==='research')extras=field('ระยะดำเนินงาน','stage',select('stage',['ทบทวนวรรณกรรม','จัดทำโครงร่าง','ขอรับรองจริยธรรม','เก็บข้อมูล','วิเคราะห์ข้อมูล','เขียนรายงาน'],a?.stage||'ทบทวนวรรณกรรม'))+field('เป้าหมายครั้งถัดไป','next',textArea('next',a?.next||''),'',true);if(type==='reflection')extras=field('สิ่งที่ทำได้ดี','strength',textArea('strength',a?.strength||''),'',true)+field('สิ่งที่ต้องพัฒนา','improve',textArea('improve',a?.improve||''),'',true)+field('แผนปฏิบัติเดือนถัดไป','next',textArea('next',a?.next||''),'',true);if(type==='advisor')extras=field('Self-reflection ก่อนพบอาจารย์','reflection',select('reflection',['ทำแล้ว','ยังไม่ได้ทำ'],a?.reflection||'ทำแล้ว'))+field('ข้อเสนอแนะจากอาจารย์','advisorNote',textArea('advisorNote',a?.advisorNote||''),'',true)+field('แผนติดตามร่วมกัน','next',textArea('next',a?.next||''),'',true);if(type==='learning')extras=field('กิจกรรมที่ต้องการเรียนรู้','learning',textArea('learning',a?.learning||''),'',true)+field('เหตุผล / เป้าหมาย','next',textArea('next',a?.next||''),'',true);if(type==='academic')extras=field('ประเภทกิจกรรม','kind',select('kind',['ผลสอบ / Pretest','OPD','Conference','Journal club','Elective'],a?.kind||'ผลสอบ / Pretest'))+field('คะแนนหรือจำนวนกิจกรรม','score',input('score',a?.score||'','text','placeholder="เช่น 80/100 หรือ 3 ครั้ง"'));return head((a?'แก้ไข':'เพิ่ม')+'บันทึก '+ACTIVITY_TYPES[type],'ใช้ข้อมูลสมมติในการทดลองเท่านั้น',btn('กลับรายการ',`activities/${type}`,'arrow'))+`<div class="card pad"><form onsubmit="saveActivity(event,'${type}','${a?.id||''}')"><div class="form-grid">${field('หัวข้อบันทึก *','title',input('title',a?.title||'','text','required'),'',true)}${field('วันที่ *','date',input('date',a?.date||TODAY,'date','required'))}${field('อาจารย์ที่ปรึกษา / ผู้กำกับดูแล','advisor',select('advisor',assessorNames(),a?.advisor||activeInstructorName()))}${field('รายละเอียด / สิ่งที่ได้เรียนรู้ *','note',textArea('note',a?.note||'','required'),'',true)}${extras}${field('สถานะ','status',select('status',['บันทึกแล้ว','ดำเนินการ','เสร็จสิ้น'],a?.status||'บันทึกแล้ว'))}</div><div class="form-actions">${btn('ยกเลิก',`activities/${type}`,'')}<button class="btn primary" type="submit">${icon('check')}บันทึกข้อมูลตัวอย่าง</button></div></form></div>`;}
function saveActivity(e,type,id){e.preventDefault();const d={...Object.fromEntries(new FormData(e.target)),type,id:id||'P'+Date.now()};if(id)state.activities=state.activities.map(a=>a.id===id?d:a);else state.activities.unshift(d);recordAudit('บันทึก '+ACTIVITY_TYPES[type]+' ตัวอย่าง');location.hash='activity/'+d.id;toast('บันทึกกิจกรรมเรียบร้อยแล้ว')}
function activityDetail(id){const a=state.activities.find(x=>x.id===id);if(!a)return notFound();const labels={note:'รายละเอียด / สิ่งที่ได้เรียนรู้',stage:'ระยะดำเนินงาน',strength:'สิ่งที่ทำได้ดี',improve:'สิ่งที่ต้องพัฒนา',next:'แผนติดตามครั้งถัดไป',advisorNote:'ข้อเสนอแนะจากอาจารย์',reflection:'Self-reflection ก่อนพบอาจารย์',learning:'กิจกรรมที่ต้องการเรียนรู้',kind:'ประเภทกิจกรรม',score:'คะแนน / จำนวน'};return head(esc(a.title),ACTIVITY_TYPES[a.type],btn('กลับรายการ',`activities/${a.type}`,'arrow')+btn('แก้ไขบันทึก',`activity-edit/${a.id}`,'file'))+`<div class="card pad"><div class="actions">${tag(ACTIVITY_TYPES[a.type],'blue')}${statusTag(a.status)}</div><dl class="kv section-gap"><dt>วันที่</dt><dd>${dateThai(a.date)}</dd><dt>อาจารย์ที่ปรึกษา</dt><dd>${esc(a.advisor)}</dd></dl>${Object.entries(labels).filter(([k])=>a[k]).map(([k,l])=>`<h2 class="section-gap">${l}</h2><p style="margin-top:10px;white-space:pre-wrap">${esc(a[k])}</p>`).join('')}</div>`;}

function rotationPage(){return head(role==='admin'?'จัดการ Rotation':'Rotation และตารางฝึก','แผนฝึกตัวอย่าง ปีการศึกษา 2569',role==='admin'?`<button class="btn" onclick="generateMonthly()">${icon('check')}สร้างงาน FEV-1 ตัวอย่าง</button><button class="btn primary" onclick="rotationModal()">${icon('plus')}เพิ่ม Rotation</button>`:btn('วันลาและข้อยกเว้น','leave','calendar'))+`<div class="grid main-side">${card('กันยายน 2569',`<div class="card-body">${calendarHTML()}<p class="small muted section-gap">กำหนดการทั้งหมดเป็นตัวอย่างเพื่อแสดงการใช้งาน</p></div>`)}${card('Rotation ปัจจุบัน',`<div class="card-body">${tag('กำลังฝึก','teal')}<h2 class="section-gap">Glaucoma</h2><dl class="kv"><dt>ช่วงเวลา</dt><dd>1–30 ก.ย. 2569</dd><dt>ผู้ประเมิน</dt><dd>${activeInstructorName()}</dd><dt>ผู้เรียน</dt><dd>${role==='resident'?currentStudent():'กลุ่มผู้เรียนตัวอย่าง'}</dd></dl>${info('วันเริ่มนับ 15 วันและวิธีจัดการช่วงลาต้องยืนยันก่อนเปิดใช้การสร้างงานอัตโนมัติ','warning')}${btn('ดู / ขอวันลา','leave','calendar','small')}</div>`)}</div><div class="card section-gap"><div class="card-head"><h2>แผน Rotation รายเดือน</h2></div>${table(['เดือน','คลินิก / สายฝึก','ผู้ประเมิน','สถานะ',...(role==='admin'?['']:[])],state.rotations.map((r,i)=>`<tr><td>${esc(r.month)}</td><td>${esc(r.clinic)}</td><td>${esc(r.teacher)}</td><td>${statusTag(r.status)}</td>${role==='admin'?`<td><button class="btn small" onclick="rotationModal(${i})">แก้ไข</button></td>`:''}</tr>`).join(''))}</div>`;}
function rotationModal(index){const r=state.rotations[index];openDialog(r?'แก้ไข Rotation':'เพิ่ม Rotation',`<form onsubmit="saveRotation(event,${Number.isInteger(index)?index:-1})"><div class="form-grid">${field('เดือน / ปี *','month',input('month',r?.month||'ม.ค. 2570','text','required'))}${field('คลินิก','clinic',select('clinic',CLINICS,r?.clinic||CLINICS[0]))}${field('อาจารย์ผู้ประเมิน','teacher',select('teacher',assessorNames(),r?.teacher||activeInstructorName()))}${field('สถานะ','status',select('status',['ยังไม่เริ่ม','กำลังฝึก','ประเมินแล้ว'],r?.status||'ยังไม่เริ่ม'))}</div><div class="form-actions"><button type="button" class="btn" onclick="closeDialog()">ยกเลิก</button><button class="btn primary">บันทึก Rotation</button></div></form>`)}
function saveRotation(e,i){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(i<0)state.rotations.push(d);else state.rotations[i]=d;recordAudit('ปรับแผน Rotation ตัวอย่าง');closeDialog();render();toast('บันทึก Rotation แล้ว')}
function generateMonthly(){openDialog('สร้างงาน FEV-1 ตัวอย่าง',`<p>สาธิตการสร้างงานเมื่อสิ้นสุด Rotation เดือนกันยายน ระบบจะยังไม่ตั้งงานอัตโนมัติจริง</p><form onsubmit="confirmMonthly(event)"><div class="form-grid">${field('อาจารย์ผู้ประเมิน','evaluator',select('evaluator',assessorNames(),activeInstructorName()))}${field('วันครบกำหนดตัวอย่าง','due',input('due','2026-10-15','date','required'))}</div><p class="section-gap">สร้างให้ผู้เรียนตัวอย่าง ${state.users.filter(u=>u.role==='resident'&&u.active).length} คน โดยไม่นับรายการเดิมซ้ำ</p><div class="form-actions"><button type="button" class="btn" onclick="closeDialog()">ยกเลิก</button><button class="btn primary">สร้างงานตัวอย่าง</button></div></form>`)}
function confirmMonthly(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(d.due<'2026-09-30'){toast('วันครบกำหนดต้องไม่ก่อนสิ้นสุด Rotation ตัวอย่าง');return}let n=0;state.users.filter(u=>u.role==='resident'&&u.active).forEach(u=>{const key='SEP26-'+u.id;if(!state.requests.some(r=>r.rotationKey===key)){state.requests.push({id:'M'+Date.now()+u.id,name:u.name,year:u.year,type:'FEV-1',form:'fev1',title:'Rotation กันยายน · Glaucoma',date:'2026-09-30',due:d.due,status:'pending',evaluator:d.evaluator,rotationKey:key});n++}});recordAudit(`สร้างงาน FEV-1 ตัวอย่าง ${n} รายการ`);closeDialog();render();toast(n?`สร้าง ${n} รายการแล้ว`:'มีงานตัวอย่างของรอบนี้ครบแล้ว ไม่มีการสร้างซ้ำ')}
function leavePage(){const rows=state.leaves.filter(l=>role!=='resident'||l.name===currentStudent());return head('วันลาและข้อยกเว้น','การอนุมัติวันลาและผลต่อการประเมินเป็นคนละขั้นตอน',btn('เพิ่มคำขอลา','new-leave','plus','primary'))+info('วันลาไม่ทำให้ยกเว้นการประเมินทั้ง Rotation โดยอัตโนมัติ ผู้ดูแลต้องระบุผลตามเกณฑ์ที่ตกลง','warning')+`<div class="card">${table(['ผู้เรียน','ประเภท / ช่วงเวลา','สถานะ','ผลต่อการประเมิน',''],rows.map(l=>`<tr><td>${esc(l.name)}</td><td>${esc(l.type)}<div class="secondary">${dateThai(l.start)} – ${dateThai(l.end)}</div></td><td>${statusTag(l.status)}</td><td>${esc(l.effect)}</td><td>${role==='admin'?`<button class="btn small" onclick="leaveDecision('${l.id}')">พิจารณา</button>`:`<button class="btn small" onclick="leaveDetail('${l.id}')">รายละเอียด</button>`}</td></tr>`).join(''))}${!rows.length?empty('ยังไม่มีคำขอลา','เพิ่มคำขอลาเพื่อทดลองขั้นตอน'):''}</div>`;}
function leaveForm(){return head('เพิ่มคำขอลา','ระบุช่วงเวลาและเหตุผลสำหรับผู้ดูแลพิจารณา',btn('กลับรายการวันลา','leave','arrow'))+`<div class="card pad"><form onsubmit="saveLeave(event)"><div class="form-grid">${field('ผู้เรียน','name',select('name',role==='admin'?state.users.filter(u=>u.role==='resident').map(u=>u.name):[currentStudent()],currentStudent()))}${field('ประเภทวันลา','type',select('type',['ประชุมวิชาการ','ลาพักผ่อน','ลาป่วย','Elective / ฝึกนอกสถานที่','อื่น ๆ'],'ประชุมวิชาการ'))}${field('วันที่เริ่ม *','start',input('start','2026-09-22','date','required'))}${field('วันที่สิ้นสุด *','end',input('end','2026-09-23','date','required'))}${field('เหตุผลประกอบ *','reason',textArea('reason','','required'),'',true)}</div><div class="form-actions">${btn('ยกเลิก','leave','')}<button class="btn primary">ส่งคำขอลาตัวอย่าง</button></div></form></div>`;}
function saveLeave(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(d.end<d.start){toast('วันที่สิ้นสุดต้องไม่ก่อนวันที่เริ่ม');return}if(state.leaves.some(l=>l.name===d.name&&l.status!=='ไม่อนุมัติ'&&d.start<=l.end&&d.end>=l.start)){toast('ช่วงวันลาทับซ้อนกับรายการเดิม กรุณาตรวจสอบ');return}state.leaves.unshift({...d,id:'L'+Date.now(),status:'รอพิจารณา',effect:'ยังไม่กำหนด'});recordAudit('สร้างคำขอลาตัวอย่าง');location.hash='leave';toast('ส่งคำขอลาตัวอย่างแล้ว')}
function leaveDetail(id){const l=state.leaves.find(l=>l.id===id);openDialog('รายละเอียดคำขอลา',`<dl class="kv"><dt>ผู้เรียน</dt><dd>${esc(l.name)}</dd><dt>ประเภท</dt><dd>${esc(l.type)}</dd><dt>ช่วงเวลา</dt><dd>${dateThai(l.start)} – ${dateThai(l.end)}</dd><dt>เหตุผล</dt><dd>${esc(l.reason)}</dd><dt>สถานะ</dt><dd>${statusTag(l.status)}</dd><dt>ผลต่อการประเมิน</dt><dd>${esc(l.effect)}</dd></dl><div class="form-actions"><button class="btn" onclick="closeDialog()">ปิด</button><button class="btn primary" onclick="closeDialog();goAs('admin','leave')">ทดลองมุมผู้ดูแล</button></div>`)}
function leaveDecision(id){const l=state.leaves.find(l=>l.id===id);openDialog('พิจารณาวันลาและผลต่อการประเมิน',`<p>${esc(l.name)} · ${dateThai(l.start)} – ${dateThai(l.end)}<br>${esc(l.reason)}</p><form onsubmit="saveLeaveDecision(event,'${id}')"><div class="form-grid">${field('ผลพิจารณา','status',select('status',['อนุมัติแล้ว','ไม่อนุมัติ','รอพิจารณา'],l.status))}${field('ผลต่อการประเมิน','effect',select('effect',['ยังไม่กำหนด','ยังต้องประเมินตามรอบเดิม','เสนอเลื่อนกำหนดส่ง','เสนอขอยกเว้นเฉพาะรอบ'],l.effect))}${field('เหตุผลการพิจารณา *','decisionNote',textArea('decisionNote',l.decisionNote||'','required'),'',true)}</div><p class="section-gap">การเลือกเสนอเลื่อนหรือยกเว้นจะบันทึกข้อเสนอไว้ให้พิจารณา ยังไม่แก้วันครบกำหนดหรือยกเว้นงานประเมิน</p><div class="form-actions"><button type="button" class="btn" onclick="closeDialog()">ยกเลิก</button><button class="btn primary">บันทึกผลพิจารณา</button></div></form>`)}
function saveLeaveDecision(e,id){e.preventDefault();Object.assign(state.leaves.find(l=>l.id===id),Object.fromEntries(new FormData(e.target)));recordAudit('บันทึกผลพิจารณาวันลาตัวอย่าง');closeDialog();render();toast('บันทึกผลพิจารณาแล้ว')}
function residentsPage(){const list=state.users.filter(u=>u.role==='resident');return head('ผู้เรียนในความดูแล','ภาพรวมและประวัติการประเมินรายบุคคล')+filters('ค้นหาผู้เรียน',select('list-filter',[['','ทุกชั้นปี'],'R1','R2','R3'],'',false,'onchange="filterRows()"'))+`<div class="grid three">${list.map(u=>{const pending=state.requests.filter(r=>r.name===u.name&&r.status==='pending').length;return `<div class="card pad" data-filter-row data-category="${u.year}"><div class="person"><span class="avatar teal">${u.year}</span><div><h2 style="font-size:16px">${esc(u.name)}</h2><p class="small muted">${esc(u.id)} · ${u.year}</p></div></div><div class="metric-row"><span>รอประเมิน</span>${tag(pending+' รายการ',pending?'orange':'gray')}</div><div class="metric-row"><span>ประเมินแล้ว</span><strong>${state.assessments.filter(a=>a.name===u.name).length} ครั้ง</strong></div><div class="section-gap">${btn('ดูแฟ้มผู้เรียน',`resident/${u.id}`,'arrow','small')}</div></div>`}).join('')}</div><div id="filter-empty" hidden>${empty('ไม่พบผู้เรียน','ลองเปลี่ยนคำค้นหาหรือชั้นปี')}</div>`;}
function residentDetail(id){const u=state.users.find(u=>u.id===id);if(!u)return notFound();const as=state.assessments.filter(a=>a.name===u.name);const rs=state.requests.filter(r=>r.name===u.name&&r.status==='pending');return head(esc(u.name),`รหัส ${esc(u.id)} · แพทย์ประจำบ้าน ${u.year}`,btn('กลับรายชื่อ','residents','users'))+`<div class="stats">${stat('คำขอรอประเมิน',rs.length,'เฉพาะผู้เรียนคนนี้','check')}${stat('ผลประเมินที่ได้รับ',as.length,'ทุกประเภทการประเมิน','chart')}${stat('อาจารย์ผู้ประเมิน',new Set(as.map(a=>a.evaluator)).size,'ผู้ประเมินที่ไม่ซ้ำกัน','users')}${stat('ชั้นปี',u.year,'เกณฑ์ผูกกับรุ่นและปีการศึกษา','book')}</div><div class="grid main-side">${card('ประวัติการประเมิน',as.length?table(['วันที่','รายการ','ผล',''],as.map(a=>`<tr><td>${dateThai(a.date)}</td><td>${a.form.toUpperCase()} · ${esc(formTitle(a.form))}</td><td>${statusTag(a.result)}</td><td>${btn('ดูผล',`assessment/${a.id}`,'','small')}</td></tr>`).join('')):empty('ยังไม่มีผลประเมิน','รายการตัวอย่างของผู้เรียนคนนี้ยังไม่มีผล'))}${card('ข้อมูลผู้เรียน',`<div class="card-body"><dl class="kv"><dt>Email ตัวอย่าง</dt><dd style="overflow-wrap:anywhere">${esc(u.email)}</dd><dt>ชั้นปี</dt><dd>${u.year}</dd><dt>ที่ปรึกษา</dt><dd>${activeInstructorName()}</dd><dt>สถานะบัญชี</dt><dd>${statusTag(u.active?'ใช้งาน':'ระงับ')}</dd></dl></div>`)}</div><div class="section-gap">${card('คำขอที่ยังรอประเมิน',rs.length?table(['ผู้เรียน','แบบประเมิน','ครบกำหนด',''],requestRows(rs)):empty('ไม่มีงานรอประเมิน','ผู้เรียนคนนี้ไม่มีคำขอค้างในตัวอย่าง'))}</div>`;}
function usersPage(){return head('จัดการผู้ใช้งาน','บัญชีแพทย์ประจำบ้าน อาจารย์ และผู้ดูแล',`<button class="btn primary" onclick="userModal()">${icon('plus')}เพิ่มผู้ใช้งาน</button>`)+filters('ค้นหาชื่อ รหัส หรือ Email',select('list-filter',[['','ทุกบทบาท'],...Object.entries(roles)],'',false,'onchange="filterRows()"'))+filterableTable(['รหัส / ชื่อ','บทบาท','Email ตัวอย่าง','สถานะ',''],state.users.map(u=>`<tr data-filter-row data-category="${u.role}"><td>${esc(u.name)}<div class="secondary">${esc(u.id)} · ${u.year}</div></td><td>${roles[u.role]}</td><td>${esc(u.email)}</td><td>${statusTag(u.active?'ใช้งาน':'ระงับ')}</td><td><button class="btn small" onclick="userModal('${u.id}')">แก้ไข</button></td></tr>`).join(''));}
function userModal(id){const u=state.users.find(u=>u.id===id);openDialog(u?'แก้ไขผู้ใช้งาน':'เพิ่มผู้ใช้งานตัวอย่าง',`<form onsubmit="saveUser(event,'${u?.id||''}')"><div class="form-grid">${field('ชื่อที่แสดง *','name',input('name',u?.name||'','text','required placeholder="ชื่อสมมติ"'))}${field('บทบาท','role',select('role',Object.entries(roles),u?.role||'resident'))}${field('Email ตัวอย่าง *','email',input('email',u?.email||'','email','required placeholder="demo@example.test"'))}${field('ชั้นปี','year',select('year',['R1','R2','R3','—'],u?.year||'R1'))}${field('สถานะ','active',select('active',[['true','ใช้งาน'],['false','ระงับ']],String(u?.active??true)))}</div><div class="form-actions"><button type="button" class="btn" onclick="closeDialog()">ยกเลิก</button><button class="btn primary">บันทึกผู้ใช้งาน</button></div></form>`)}
function saveUser(e,id){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(state.users.some(u=>u.id!==id&&u.email.toLowerCase()===d.email.toLowerCase())){toast('Email นี้มีอยู่แล้วในข้อมูลตัวอย่าง');return}d.active=d.active==='true';if(d.role!=='resident')d.year='—';d.id=id||'U'+Date.now();if(id){const old=state.users.find(u=>u.id===id);state.requests.forEach(r=>{if(r.name===old.name)r.name=d.name;if(r.evaluator===old.name)r.evaluator=d.name});state.assessments.forEach(a=>{if(a.name===old.name)a.name=d.name;if(a.evaluator===old.name)a.evaluator=d.name});state.leaves.forEach(l=>{if(l.name===old.name)l.name=d.name});state.users=state.users.map(u=>u.id===id?d:u)}else state.users.push(d);recordAudit('ปรับปรุงผู้ใช้งานตัวอย่าง');closeDialog();render();toast('บันทึกผู้ใช้งานตัวอย่างแล้ว')}
function cohortsPage(){return head('รุ่นและปีการศึกษา','แยกรุ่นเข้าฝึก ชั้นปี และปีการศึกษาให้ชัดเจน',`<button class="btn primary" onclick="cohortModal()">${icon('plus')}เพิ่มรุ่น</button>`)+info('ปีการศึกษาตัวอย่าง 2569 · ก.ค. 2569 – มิ.ย. 2570 วันที่และการเลื่อนชั้นปีต้องยืนยันตามหลักสูตร')+`<div class="grid three">${state.cohorts.map((c,i)=>`<section class="card pad"><div class="catalog-top">${tag(c.year,'teal')}<button class="btn small" onclick="cohortModal(${i})">แก้ไข</button></div><h2 class="section-gap">${esc(c.name)}</h2><div class="stat-value">${state.users.filter(u=>u.role==='resident'&&u.year===c.year).length}<small>ผู้เรียนตัวอย่างในชั้นปี</small></div><p class="small muted">ใช้เกณฑ์ฉบับรอรับรอง</p><div class="section-gap">${btn('ดูผู้เรียน','users','users','small')}</div></section>`).join('')}</div><div class="card pad section-gap"><h2>การเลื่อนชั้นปี</h2><p class="small muted section-gap">ระบบจริงควรบันทึกชั้นปี ณ วันที่ทำกิจกรรมและประวัติรุ่นเดิมไว้ การปรับชั้นปีปัจจุบันต้องไม่เปลี่ยนข้อมูลย้อนหลัง</p><div class="section-gap">${btn('ตรวจเกณฑ์แต่ละชั้นปี','curriculum','file')}</div></div>`;}
function cohortModal(i){const c=state.cohorts[i];openDialog(c?'แก้ไขรุ่น':'เพิ่มรุ่นตัวอย่าง',`<form onsubmit="saveCohort(event,${Number.isInteger(i)?i:-1})"><div class="form-grid">${field('ชื่อรุ่น *','name',input('name',c?.name||'','text','required placeholder="รุ่นตัวอย่าง 2570"'))}${field('ชั้นปีปัจจุบัน','year',select('year',['R1','R2','R3'],c?.year||'R1'))}</div><div class="form-actions"><button type="button" class="btn" onclick="closeDialog()">ยกเลิก</button><button class="btn primary">บันทึก</button></div></form>`)}
function saveCohort(e,i){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(i<0)state.cohorts.push(d);else state.cohorts[i]=d;recordAudit('ปรับรุ่นตัวอย่าง');closeDialog();render();toast('บันทึกรุ่นตัวอย่างแล้ว')}

function reportsPage(){const reportType=new URLSearchParams(location.hash.split('?')[1]||'').get('type')||'assessments';const filtersHTML=`<form class="toolbar" onsubmit="applyReport(event)"><div class="filters">${select('reportType',[['assessments','ผลการประเมิน'],['pending','งานรอประเมิน'],['cases','Logbook'],['progress','จำนวนเคสเทียบขั้นต่ำ']],reportType)}${select('reportYear',[['all','ทุกชั้นปี'],'R1','R2','R3'],new URLSearchParams(location.hash.split('?')[1]||'').get('year')||'all')}<button class="btn primary">แสดงรายงาน</button></div><button type="button" class="btn" onclick="exportCurrentReport()">${icon('download')}ส่งออก CSV</button></form>`;const yr=new URLSearchParams(location.hash.split('?')[1]||'').get('year')||'all';let content='';if(reportType==='assessments'){const list=state.assessments.filter(a=>(yr==='all'||a.year===yr)&&(role!=='resident'||a.name===currentStudent()));content=table(['วันที่','ผู้เรียน','ชั้นปี','แบบประเมิน','ผู้ประเมิน','ผล'],list.map(a=>`<tr><td>${dateThai(a.date)}</td><td>${esc(a.name)}</td><td>${a.year}</td><td>${a.form.toUpperCase()}</td><td>${esc(a.evaluator)}</td><td>${statusTag(displayResult(a))}</td></tr>`).join(''))}else if(reportType==='pending'){const list=state.requests.filter(r=>r.status==='pending'&&(yr==='all'||r.year===yr)&&(role!=='resident'||r.name===currentStudent()));content=table(['ผู้เรียน','ชั้นปี','แบบประเมิน','ครบกำหนด'],list.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.year}</td><td>${esc(r.title)}</td><td>${dateThai(r.due)}</td></tr>`).join(''))}else if(reportType==='cases'){content=yr==='all'||yr==='R1'?table(['วันที่','ผู้เรียน','หัตถการ','รหัสตัวอย่าง'],[...state.cases].slice(0,30).map(c=>`<tr><td>${dateThai(c.date)}</td><td>${currentStudent()}</td><td>${esc(ACTIVITIES[c.activity][0])}</td><td>${esc(c.caseRef)}</td></tr>`).join('')):empty('ยังไม่มี Logbook ตัวอย่างของชั้นปีนี้','ข้อมูล Logbook สำหรับสาธิตเป็นของผู้เรียน R1')}else content=yr==='all'||yr==='R1'?table(['หัตถการ','ทำแล้ว','ขั้นต่ำ','ยังขาด'],ACTIVITIES.map(([n,m],i)=>{const c=state.cases.filter(c=>+c.activity===i).length;return `<tr><td>${n}</td><td>${c}</td><td>${m}</td><td>${Math.max(0,m-c)}</td></tr>`}).join('')):empty('ยังไม่มีข้อมูลตัวอย่างของชั้นปีนี้','เปลี่ยนเป็น R1 หรือทุกชั้นปี');return head('รายงานและการส่งออก','เลือกประเภทข้อมูลและชั้นปีเพื่อดูรายงาน',`<button class="btn" onclick="window.print()">${icon('file')}พิมพ์ / PDF</button>`)+filtersHTML+info('รายงานใช้ข้อมูลสมมติในต้นแบบ ไม่ใช่ผลประเมินจริงของแพทย์ประจำบ้าน')+`<div class="card">${content}</div>`+(reportType==='cases'?'<p class="small muted section-gap">หน้าแสดงตัวอย่างสูงสุด 30 แถว การส่งออก CSV จะได้ทุกรายการที่ตรงกับตัวกรอง</p>':'');}

function csvDownload(name,headers,rows){const safe=v=>{let s=String(v??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const str='\ufeff'+[headers,...rows].map(r=>r.map(safe).join(',')).join('\r\n');const a=document.createElement('a');const url=URL.createObjectURL(new Blob([str],{type:'text/csv;charset=utf-8;'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('ดาวน์โหลดข้อมูลตัวอย่างแล้ว')}

function parseCSV(text){const rows=[];let row=[],value='',quote=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(quote&&text[i+1]==='"'){value+='"';i++}else quote=!quote}else if(ch===','&&!quote){row.push(value);value=''}else if((ch==='\n'||ch==='\r')&&!quote){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(value);if(row.some(x=>x.trim()))rows.push(row);row=[];value=''}else value+=ch}if(quote)throw new Error('เครื่องหมายคำพูดใน CSV ไม่ครบคู่');row.push(value);if(row.some(x=>x.trim()))rows.push(row);return rows}
async function previewImport(file){const out=document.getElementById('import-result');importPreview=[];if(!file)return;if(file.size>1048576){out.innerHTML=info('ไฟล์ใหญ่เกิน 1 MB','warning');return}try{const rows=parseCSV((await file.text()).replace(/^\ufeff/,''));const h=rows.shift()?.map(s=>s.trim());if(!h||['name','email','role','year'].some(k=>!h.includes(k)))throw new Error('หัวคอลัมน์ต้องมี name, email, role และ year');const seen=new Set(state.users.map(u=>u.email.toLowerCase()));importPreview=rows.map((r,i)=>{const d=Object.fromEntries(h.map((k,j)=>[k,(r[j]||'').trim()]));let problem='';if(!d.name||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)||!roles[d.role])problem='ชื่อ Email หรือบทบาทไม่ถูกต้อง';else if(d.role==='resident'&&!['R1','R2','R3'].includes(d.year))problem='ชั้นปีไม่ถูกต้อง';else if(seen.has(d.email.toLowerCase()))problem='Email ซ้ำ';seen.add(d.email.toLowerCase());return {...d,row:i+2,problem}});const ok=importPreview.filter(r=>!r.problem).length;out.innerHTML=`<h2>2. ตรวจข้อมูล ${importPreview.length} แถว</h2><p class="small muted section-gap">พร้อมนำเข้า ${ok} แถว · ต้องแก้ไข ${importPreview.length-ok} แถว</p>${table(['แถว','ชื่อ','สถานะ'],importPreview.map(r=>`<tr><td>${r.row}</td><td>${esc(r.name)}</td><td>${tag(r.problem||'พร้อมนำเข้า',r.problem?'red':'teal')}</td></tr>`).join(''))}<div class="section-gap"><button class="btn primary" onclick="commitImport()" ${!ok?'disabled':''}>นำเข้าเฉพาะ ${ok} แถวที่พร้อม</button></div>`}catch(e){out.innerHTML=info(esc(e.message),'warning')}}
function commitImport(){const ok=importPreview.filter(r=>!r.problem);if(!ok.length)return;ok.forEach((u,i)=>state.users.push({id:'IM'+Date.now()+i,name:u.name,email:u.email,role:u.role,year:u.role==='resident'?u.year:'—',active:true}));recordAudit(`นำเข้ารายชื่อสมมติ ${ok.length} คน`);importPreview=[];location.hash='users';toast('นำเข้ารายชื่อในต้นแบบเรียบร้อยแล้ว')}

function settingsPage(){const s=state.settings;return head('ตั้งค่าการใช้งาน','การตั้งค่าทั้งหมดมีผลเฉพาะต้นแบบในเบราว์เซอร์นี้')+`<div class="grid main-side"><div class="card pad"><h2>การแจ้งเตือน</h2>${[['inApp','ภายในระบบ','แสดงรายการแจ้งเตือนตัวอย่าง'],['email','Email','แสดงการตั้งค่า ไม่มีการส่งจริง'],['line','LINE Official Account','ต้องเชื่อม Messaging API ในระบบจริง']].map(([k,t,d])=>`<label class="switch-row"><span><strong>${t}</strong><p>${d}</p></span><input aria-label="${t}" type="checkbox" ${s[k]?'checked':''} onchange="saveSetting('${k}',this.checked)"></label>`).join('')}<h2 class="section-gap">การแสดงคะแนน</h2><label class="switch-row"><span><strong>ให้ผู้เรียนเห็นคะแนนละเอียดและ Level</strong><p>ทดลองเปลี่ยนแล้วดูผลในมุมผู้เรียน นโยบายจริงยังรอยืนยัน</p></span><input aria-label="ให้ผู้เรียนเห็นคะแนน" type="checkbox" ${s.showScores?'checked':''} onchange="saveSetting('showScores',this.checked)"></label><div class="section-gap">${btn('ดูหน้าผลประเมิน','history','chart')}</div></div><div><div class="card pad"><h2>ข้อมูลตัวอย่าง</h2><p class="small muted section-gap">การเพิ่ม แก้ไข และให้คะแนนจะบันทึกในเครื่องนี้เท่านั้น ผู้เปิดไฟล์หรือเว็บไซต์จากเครื่องอื่นจะเริ่มจากข้อมูลตัวอย่างชุดเดียวกัน</p><div class="section-gap"><button class="btn danger" onclick="resetDemo()">เริ่มข้อมูลตัวอย่างใหม่</button></div></div><div class="card pad section-gap"><h2>บัญชีและสิทธิ์</h2><p class="small muted section-gap">ตัวเลือกบทบาทใช้สำหรับดูหน้าจอ ไม่มีการตรวจสอบสิทธิ์จริง การเข้าสู่ระบบและฐานข้อมูลเป็นงานพัฒนาในขั้นถัดไป</p><div class="section-gap">${btn('หน้าเข้าสู่ระบบ','login','logout','small')}</div></div></div></div>`;}

const PAGE_GROUPS=[{role:'resident',title:'แพทย์ประจำบ้าน',items:[['dashboard','ภาพรวมของฉัน'],['logbook','รายการ Logbook'],['new-case','บันทึกหัตถการ'],['case/LOG0001','รายละเอียดเคส'],['requests','คำขอประเมิน'],['new-request','สร้างคำขอประเมิน'],['request/A001','รายละเอียดคำขอ'],['progress','ความก้าวหน้าหัตถการ'],['competencies','ความก้าวหน้า EPA / DOPS'],['history','ประวัติผลประเมิน'],['assessment/E001','ผลประเมินและ Feedback'],['portfolio','E-Portfolio'],...Object.entries(ACTIVITY_TYPES).map(([k,v])=>['activities/'+k,v]),['activity-new/research','บันทึกกิจกรรม Portfolio'],['rotation','ตาราง Rotation'],['leave','วันลา'],['new-leave','ขอวันลา']]},{role:'instructor',title:'อาจารย์',items:[['dashboard','ภาพรวมอาจารย์'],['queue','งานรอประเมิน'],['evaluate/A001','ให้ผล EPA'],['evaluate/A002','ให้ผล DOPS'],['evaluate/A003','ให้ผล FEV-1'],['history','ประวัติการประเมิน'],['residents','ผู้เรียนในความดูแล'],['resident/R001','แฟ้มผู้เรียน'],['forms','คลังแบบประเมิน 28 แบบ'],['form/glaucoma','Glaucoma club'],['reports','รายงาน']]},{role:'admin',title:'ผู้ดูแลระบบ',items:[['dashboard','ภาพรวมภาควิชา'],['users','จัดการผู้ใช้งาน'],['cohorts','รุ่นและปีการศึกษา'],['rotation','จัดการ Rotation'],['leave','พิจารณาวันลา'],['curriculum','เกณฑ์และแบบประเมิน'],['monitor','ติดตามงานค้าง'],['reports','รายงานและส่งออก'],['import','นำเข้ารายชื่อ CSV'],['audit','ประวัติการเปลี่ยนแปลง']]},{role:null,title:'หน้าส่วนกลาง',items:[['login','เข้าสู่ระบบ'],['recover','ลืมรหัสผ่าน'],['notifications','การแจ้งเตือน'],['profile','ข้อมูลบัญชี'],['settings','ตั้งค่า'],['about','ขอบเขตและข้อเสนอ']]}];
function sitemapPage(){return head('หน้าทั้งหมดของระบบ','เลือกหน้าจอที่ต้องการดู ระบบจะเปลี่ยนบทบาทให้ตามมุมมองนั้น')+info('ทดลองได้ครบทั้งการบันทึกเคส ขอประเมิน ให้คะแนน จัดการผู้ใช้งานและรายงาน ข้อมูลที่ทดลองจะอยู่เฉพาะเบราว์เซอร์เครื่องนี้')+`<div class="page-map">${PAGE_GROUPS.map(g=>`<section class="card pad"><h2>${g.title}</h2>${g.items.map(([r,n])=>`<a href="#${r}" ${g.role?`onclick="role='${g.role}';persistRole()"`:''}><span>${n}</span>${icon('arrow')}</a>`).join('')}</section>`).join('')}</div><div class="card pad section-gap"><h2>แบบประเมินที่เปิดทดลองได้</h2><div class="grid three section-gap">${FORMS.map(f=>`<a href="#form/${f.id}" class="small">${f.id.toUpperCase()} · ${esc(f.title)}</a>`).join('')}</div></div>`;}
function aboutPage(){return head('ขอบเขตและข้อเสนอสำหรับอาจารย์','ต้นแบบหน้าจอเพื่อหารือก่อนกำหนดรายละเอียดการพัฒนา',`<button class="btn" onclick="window.print()">${icon('download')}พิมพ์สรุป</button>`)+`<div class="welcome-card"><div><h2>บันทึกเคส ประเมินทักษะ และติดตามความก้าวหน้าในระบบเดียว</h2><p>รองรับแพทย์ประจำบ้าน อาจารย์ และผู้ดูแลระบบ</p></div></div><div class="grid two"><div class="card pad"><h2>ครอบคลุมในต้นแบบนี้</h2><div class="mini-list">${['Logbook และเกณฑ์ขั้นต่ำ 30 รายการ','FEV-1, EPA 6 แบบ และ DOPS 13 แบบ','Long case 3 แบบ และ Skill board 4 แบบ','งานวิจัย Self-reflection และ Advisor feedback','รุ่น ปีการศึกษา Rotation และวันลา','แจ้งเตือน รายงาน และการนำเข้าตัวอย่าง'].map(t=>`<div>${t}${icon('check')}</div>`).join('')}</div></div><div class="card pad"><h2>ขอบเขตการทดลอง</h2><p class="small muted section-gap">ข้อมูลบุคคล เคส วันนัด และผลประเมินเป็นข้อมูลสมมติ หัวข้อแบบประเมินอิงเอกสารเดิมที่ให้มาตรวจ</p><p class="small muted section-gap">การบันทึกและการตั้งค่าอยู่ในเบราว์เซอร์เครื่องนี้ ไม่แชร์ข้ามผู้ใช้ ไม่มีระบบเข้าสู่บัญชีจริง ฐานข้อมูล หรือการส่ง Email / LINE</p><p class="small muted section-gap">การรับรองเกณฑ์ การเชื่อมระบบ และการนำเข้าข้อมูลจริงเป็นงานขั้นถัดไป</p></div></div><div class="card section-gap"><div class="card-head"><h2>ประเด็นที่ต้องยืนยัน</h2></div>${table(['ประเด็น','สิ่งที่พบ / ข้อเสนอ'],[['FEV-1','ข้อมูลเดิมใช้คะแนนรายข้อ 0–4 ไม่ใช่ EPA Level 1–5 ต้องยืนยันเกณฑ์ผ่านและการประเมินซ้ำ'],['EPA / DOPS','อย่างน้อย 2 ครั้งกับอาจารย์คนละท่าน ต้องยืนยันการนับครั้งที่ผ่านหรือเข้าสอบ'],['กำหนดส่ง','เอกสารมีทั้งเมษายนและมิถุนายน ส่วน FEV-1 ระบุภายใน 15 วันหลังลงสาย ต้องตกลงวันที่เริ่มนับ'],['การเห็นคะแนน','กำหนดว่าจะให้ผู้เรียนเห็นผลสรุป คะแนนรายข้อ และ Level มากน้อยเพียงใด'],['วันลา','ต้องกำหนดเงื่อนไขยกเว้นหรือเลื่อนกำหนดส่ง ไม่มีการยกเว้นทั้งรอบอัตโนมัติ'],['การย้ายข้อมูล','ใช้คำตอบต้นทาง ตรวจซ้ำ ตรวจวันที่ และตรวจสูตรเดิมก่อนนำเข้า'],['งบเบื้องต้น 50,000 บาท','ต้องตกลงจำนวนโมดูล การย้ายข้อมูล การเชื่อมระบบ และค่าดูแล ไม่ใช่ราคายืนยันครอบคลุมทุกหน้าที่แสดง']].map(([a,b])=>`<tr><td><strong>${a}</strong></td><td style="white-space:normal">${b}</td></tr>`).join(''))}</div><div class="card pad section-gap"><h2>เอกสารที่ใช้ประกอบ</h2><p class="small muted section-gap">สรุปขอบเขต Markdown · E-Portfolio ฉบับ 230720 และ 240701 · Guideline E-port · ตาราง Logbook · แบบประเมินและ Portfolio ในชุดเอกสารที่ให้มา รวม 148 ไฟล์</p><p class="small muted section-gap">LINE Notify ยุติบริการแล้ว ทางเลือกการเชื่อม LINE คือ Official Account และ Messaging API ตาม <a href="https://developers.line.biz/en/news/2025/04/01/line-notify/" target="_blank" rel="noopener">ประกาศจาก LINE Developers</a></p><div class="section-gap">${btn('เปิดดูทุกหน้าจอ','sitemap','map','primary')}</div></div>`;}
function openDialog(title,body){const d=document.getElementById('dialog');d.innerHTML=`<div class="dialog-head"><h2>${title}</h2><button class="icon-btn" onclick="closeDialog()" aria-label="ปิดหน้าต่าง">${icon('close')}</button></div><div class="dialog-content">${body}</div>`;if(!d.open)d.showModal();}
function closeDialog(){document.getElementById('dialog').close()}
let confirmAction=null;
function confirmDialog(title,description,action){confirmAction=action;openDialog(title,`<p>${description}</p><div class="actions"><button class="btn" onclick="closeDialog()">ยกเลิก</button><button class="btn primary" onclick="runConfirm()">ยืนยัน</button></div>`)}
function runConfirm(){closeDialog();const fn=confirmAction;confirmAction=null;fn?.()}
function persistRole(){try{localStorage.setItem('cuoph-role',role)}catch{}}

function render(){const hash=(location.hash.slice(1)||'dashboard').split('?')[0];const parts=hash.split('/');route=parts[0];const id=decodeURIComponent(parts[1]||'');const pages={dashboard:()=>role==='resident'?residentDashboard():role==='admin'?adminDashboard():dashboard(),queue:()=>queuePage(),monitor:()=>queuePage(true),logbook:logbookPage,'new-case':()=>caseForm(),'edit-case':()=>caseForm(id),case:()=>caseDetail(id),requests:requestsPage,'new-request':()=>requestForm(id),request:()=>requestDetail(id),evaluate:()=>assessmentForm(id),form:()=>assessmentForm(id,true),history:historyPage,assessment:()=>assessmentDetail(id),forms:()=>formsPage(id),progress:progressPage,competencies:competenciesPage,portfolio:portfolioPage,activities:()=>activityList(id),'activity-new':()=>activityForm(id),'activity-edit':()=>activityForm(null,id),activity:()=>activityDetail(id),rotation:rotationPage,leave:leavePage,'new-leave':leaveForm,residents:residentsPage,resident:()=>residentDetail(id),users:usersPage,cohorts:cohortsPage,curriculum:curriculumPage,reports:reportsPage,import:importPage,notifications:notificationsPage,profile:profilePage,settings:settingsPage,audit:auditPage,sitemap:sitemapPage,about:aboutPage};if(route==='login'||route==='recover'){loginPage(route==='recover');document.title='CUOPH · '+(route==='login'?'เข้าสู่ระบบ':'ขอความช่วยเหลือ');return}shell((pages[route]||notFound)());const title=document.querySelector('main h1')?.textContent||'Logbook';document.title=title+' · CUOPH Logbook';filterRows();window.scrollTo(0,0);}
