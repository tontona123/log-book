<style>
/* Mobile and role colours for the September professor review. */
:root{--review-accent:#0b7f87;--review-soft:#e0f3f5;--review-blue:#3569bd;--review-violet:#7650b5}
body{font-size:16px;line-height:1.65;background:#f2f6fa}
body[data-role=instructor]{--review-accent:#6750a4;--review-soft:#eee9fa}
body[data-role=admin]{--review-accent:#315dab;--review-soft:#e7efff}
body[data-role=chief]{--review-accent:#b04f24;--review-soft:#fff0e6}
.sidebar{background:linear-gradient(155deg,#123f53,#173544 72%)}
.sidebar .nav a.active{background:var(--review-soft);color:var(--review-accent);box-shadow:inset 4px 0 var(--review-accent)}
.nav a{font-size:14px;min-height:44px}.nav-foot a{color:#dbecfa;font-size:13px}
.topbar{height:auto;min-height:78px;padding-block:12px;gap:14px}.top-controls{flex-wrap:wrap;justify-content:flex-end}
.demo-person{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.demo-person select,.role-control select{font:inherit;font-size:14px;padding:8px;border-radius:9px;border:1px solid var(--line);background:white;max-width:210px;min-height:42px}
.demo-bar{font-size:13px;gap:12px}.page-head h1{font-size:30px;line-height:1.4}.page-head p{font-size:15px;max-width:700px}
.page-head .actions{flex-wrap:wrap}.btn{min-height:44px;font-size:14px}.btn.small{min-height:38px;font-size:13px}.btn.primary{background:var(--review-accent);border-color:var(--review-accent)}
.input{font-size:16px;min-height:44px}.field label{font-size:14px}.help,.secondary,.small{font-size:13px}.card-head h2,.card h2{line-height:1.5}
.stat{border-top:4px solid var(--review-accent)}.stat:nth-child(2){border-top-color:#3b82c4}.stat:nth-child(3){border-top-color:#b86626}.stat:nth-child(4){border-top-color:#8560b9}
.stat-icon{background:var(--review-soft);color:var(--review-accent)}.stat-note{font-size:13px}.stat-value{font-size:32px}.tabs{overflow-x:auto;flex-wrap:nowrap;gap:4px;padding-bottom:5px;scrollbar-width:thin}
.tabs a{white-space:nowrap;min-height:45px;font-size:14px}.tabs a.active{color:var(--review-accent);border-bottom-color:var(--review-accent);background:var(--review-soft);border-radius:8px 8px 0 0}
.review-toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:20px}.review-toolbar .field{min-width:160px;flex:1;margin:0}.review-toolbar .input{width:100%}
.review-toolbar .btn{flex:none}.review-note{font-size:14px;background:#edf3fa;padding:14px 18px;border-radius:12px;color:#3a5366;margin:16px 0}
.review-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:18px}

const info=(text,kind='')=>`<div class="info ${kind}">${text}</div>`;
const filters=(placeholder='ค้นหา...',extras='')=>`<div class="toolbar"><div class="filters"><input class="input search" aria-label="ค้นหารายการ" placeholder="${placeholder}" oninput="filterRows()" id="list-search">${extras}</div><span id="list-count" class="small muted"></span></div>`;
const routeLink=(r,label)=>`<a href="#${r}">${label}</a>`;
const scoreVisible=()=>role!=='resident'||state.settings.showScores;
function displayResult(a){if(!scoreVisible()&&a.result.startsWith('Level'))return 'ประเมินแล้ว';return a.result}
function statusTag(s){return tag(s,/ผ่าน|แล้ว|อนุมัติ|พร้อม/.test(s)&&!s.includes('ไม่ผ่าน')?'teal':/ไม่ผ่าน|ปฏิเสธ/.test(s)?'red':/รอ|ดำเนิน/.test(s)?'orange':'gray')}
function recordAudit(action){state.audit.unshift({time:new Date().toLocaleString('th-TH'),actor:me(),action});persist()}
function goAs(r,target){role=r;try{localStorage.setItem('cuoph-role',r)}catch{};location.hash=target;render()}
function setRole(v){goAs(v,'dashboard')}
function filterRows(){const q=document.getElementById('list-search')?.value.toLowerCase()||'';const s=document.getElementById('list-filter')?.value||'';let visible=0;document.querySelectorAll('[data-filter-row]').forEach(el=>{const ok=el.textContent.toLowerCase().includes(q)&&(!s||el.dataset.category===s);el.hidden=!ok;if(ok)visible++});const c=document.getElementById('list-count');if(c)c.textContent=`${visible} รายการ`;let no=document.getElementById('filter-empty');if(no)no.hidden=visible>0}
function filterableTable(headers,rows){return `<div class="card">${table(headers,rows)}<div id="filter-empty" hidden>${empty('ไม่พบรายการ','ลองเปลี่ยนคำค้นหาหรือตัวกรอง')}</div></div>`}
function residentDashboard(){const mine=state.requests.filter(r=>r.name===currentStudent()&&r.status==='pending');const complete=ACTIVITIES.filter((a,i)=>state.cases.filter(c=>+c.activity===i).length>=a[1]).length;return head('ภาพรวมของฉัน',`${esc(currentStudent())} · แพทย์ประจำบ้าน R1 · ปีการศึกษา 2569`,btn('บันทึกหัตถการ','new-case','plus','primary'))+`<div class="welcome-card"><div><h2>Rotation เดือนนี้ · Glaucoma</h2><p>1–30 กันยายน 2569 · อาจารย์ที่ปรึกษา: อาจารย์ตัวอย่าง ก</p></div>${btn('ขอรับการประเมิน','new-request','check')}</div><div class="stats">${stat('บันทึกหัตถการ',state.cases.length,'จำนวนเคสตัวอย่างสะสม','book')}${stat('ครบจำนวนขั้นต่ำ',`${complete}<small>/ 30 รายการ</small>`,'แยกจากผลสอบ EPA / DOPS','chart')}${stat('รอผลประเมิน',mine.length,'ติดตามได้ในหน้าคำขอประเมิน','clock','orange')}${stat('ผลประเมินที่ได้รับ',state.assessments.filter(a=>a.name===currentStudent()).length,'ดูรายละเอียดและคำแนะนำ','check')}</div><div class="grid main-side">${card('หัตถการที่กำลังสะสม',`<div class="card-body progress-list">${[0,2,7,19,20].map(i=>{const n=state.cases.filter(c=>+c.activity===i).length;return `<div><div class="progress-label"><span>${ACTIVITIES[i][0]}</span><small>${n} / ${ACTIVITIES[i][1]} เคส</small></div><div class="progress"><span style="width:${Math.min(100,n/ACTIVITIES[i][1]*100)}%"></span></div></div>`}).join('')}</div>`,'เกณฑ์ตัวอย่างจากเอกสารเดิม',`<a class="card-link" href="#progress">ดูครบ 30 รายการ →</a>`)}${card('สิ่งที่ต้องติดตาม',`<div class="card-body mini-list"><a href="#requests"><span>คำขอที่ยังรออาจารย์</span>${tag(mine.length+' รายการ','orange')}</a><a href="#activities/reflection"><span>Self-reflection เดือนนี้</span>${tag('บันทึกข้อมูล','blue')}</a><a href="#activities/research"><span>ความก้าวหน้างานวิจัย</span>${icon('arrow')}</a><a href="#rotation"><span>ตารางฝึกและวันลา</span>${icon('arrow')}</a></div>`)}</div><div class="section-gap">${card('คำแนะนำล่าสุด',`<div class="card-body"><div class="person"><span class="avatar teal">อจ</span><div><strong>อาจารย์ตัวอย่าง ข</strong><div class="small muted">EPA 1 · 9 ก.ย. 2569</div></div></div><p style="margin:17px 0;font-size:15px">${esc(state.assessments.find(a=>a.id==='E001')?.feedback||'ดูคำแนะนำได้ในประวัติการประเมิน')}</p>${btn('ดูประวัติการประเมิน','history','arrow','small')}</div>`)}</div>`;}
function adminDashboard(){return head('ภาพรวมภาควิชา','ติดตามการฝึกอบรมและการประเมินของทุกรุ่น',btn('ดูรายงาน','reports','download'))+info('ข้อมูลทั้งหมดในหน้านี้เป็นสถานการณ์สมมติสำหรับพิจารณาระบบ ยังไม่มีการเชื่อมข้อมูลผู้เรียนจริง')+`<div class="stats">${stat('แพทย์ประจำบ้าน',state.users.filter(u=>u.role==='resident').length,'3 ชั้นปี · ข้อมูลตัวอย่าง','users')}${stat('รายการรอประเมิน',state.requests.filter(r=>r.status==='pending').length,'ดูผู้รับผิดชอบและกำหนดส่ง','check')}${stat('คำขอลารอพิจารณา',state.leaves.filter(l=>l.status==='รอพิจารณา').length,'การลาและการยกเว้นแยกกัน','calendar')}${stat('แบบประเมิน',FORMS.length,'EPA 6 · DOPS 13 · อื่น ๆ 9','file')}</div><div class="grid main-side">${card('การประเมินที่ต้องติดตาม',table(['ผู้เรียน','แบบประเมิน','ครบกำหนด',''],requestRows(state.requests.filter(r=>r.status==='pending'),4)),'',`<a class="card-link" href="#monitor">ดูทั้งหมด →</a>`)}${card('สถานะการเตรียมระบบ',`<div class="card-body mini-list"><a href="#curriculum"><span>เกณฑ์การประเมิน</span>${tag('รอยืนยัน','orange')}</a><a href="#cohorts"><span>รุ่นและปีการศึกษา</span>${tag('3 รุ่นตัวอย่าง','blue')}</a><a href="#import"><span>นำเข้าข้อมูลเดิม</span>${icon('arrow')}</a><a href="#settings"><span>ช่องทางแจ้งเตือน</span>${tag('สาธิต','gray')}</a></div>`)}</div><div class="grid two section-gap">${card('จำนวนการประเมินรายเดือน',`<div class="card-body"><div class="bar-chart">${[['เม.ย.',38],['พ.ค.',62],['มิ.ย.',96],['ก.ค.',68],['ส.ค.',86],['ก.ย.',58]].map(([m,v])=>`<div class="bar-col"><span>${Math.round(v/4)}</span><div class="bar" style="height:${v}px"></div><span>${m}</span></div>`).join('')}</div><p class="small muted" style="margin-top:15px">จำนวนสมมติ แสดงตัวอย่างรูปแบบรายงาน</p></div>`)}${card('งานสำหรับผู้ดูแล',`<div class="card-body mini-list"><a href="#users"><span>เพิ่มหรือปรับปรุงรายชื่อ</span>${icon('arrow')}</a><a href="#rotation"><span>กำหนดผู้ประเมินตาม Rotation</span>${icon('arrow')}</a><a href="#leave"><span>พิจารณาวันลาและข้อยกเว้น</span>${icon('arrow')}</a><a href="#audit"><span>ประวัติการเปลี่ยนแปลง</span>${icon('arrow')}</a></div>`)}</div>`;}
function queuePage(monitor=false){const rows=monitor?state.requests.filter(r=>r.status==='pending'):pendingRequests();return head(monitor?'ติดตามการประเมิน':'งานรอประเมิน','เลือกผู้เรียนและแบบประเมินเพื่อบันทึกผล',`<button class="btn" onclick="exportRequests()">${icon('download')}ส่งออก CSV</button>`)+filters('ค้นหาผู้เรียนหรือหัตถการ',select('list-filter',[['','ทุกประเภท'],['EPA','EPA'],['DOPS','DOPS'],['FEV-1','FEV-1']],'',false,'onchange="filterRows()"'))+filterableTable(['แพทย์ประจำบ้าน','แบบประเมิน','ครบกำหนด','ดำเนินการ'],rows.map(r=>`<tr data-filter-row data-category="${r.type}"><td>${person(r.name,r.year)}</td><td>${tag(r.type,r.type==='EPA'?'teal':'blue')}<div style="margin-top:6px">${esc(r.title)}</div><div class="secondary">ส่งคำขอ ${dateThai(r.createdDate||r.date)}</div></td><td>${dateThai(r.due)}<div>${r.due<TODAY?tag('เลยกำหนดตัวอย่าง','red'):tag('รอประเมิน','orange')}</div></td><td><div class="actions">${btn('เริ่มประเมิน',`evaluate/${r.id}`,'check','primary small')}${monitor?`<button class="btn small" onclick="simulateReminder('${r.id}')">แจ้งเตือนตัวอย่าง</button>`:''}</div></td></tr>`).join(''))+`<div class="section-gap">${info('กำหนดส่งในต้นแบบเป็นข้อมูลสมมติ ต้องยืนยันวันเริ่มนับ 15 วันของ FEV-1 และเส้นตาย EPA/DOPS ก่อนใช้งานจริง')}</div>`;}
function logbookPage(){return head('Logbook ของฉัน','ประวัติหัตถการและผู้กำกับดูแลตลอดการฝึกอบรม',btn('บันทึกหัตถการ','new-case','plus','primary'))+`<div class="stats">${stat('เคสสะสม',state.cases.length,'ข้อมูลตัวอย่างที่บันทึกไว้','book')}${stat('เดือนกันยายน',state.cases.filter(c=>c.date.startsWith('2026-09')).length,'ตามวันที่ทำหัตถการ','calendar')}${stat('ชนิดหัตถการ',new Set(state.cases.map(c=>+c.activity)).size,'จาก 30 รายการหลัก','file')}${stat('ผู้กำกับดูแล',new Set(state.cases.map(c=>c.supervisor)).size,'อาจารย์ / fellow','users')}</div>`+filters('ค้นหาหัตถการหรือรหัสเคส',select('list-filter',[['','ทุกคลินิก'],...CLINICS],'',false,'onchange="filterRows()"'))+filterableTable(['วันที่ทำ','หัตถการ','รหัสเคสตัวอย่าง','ผู้กำกับดูแล',''],[...state.cases].sort((a,b)=>b.date.localeCompare(a.date)).map(c=>`<tr data-filter-row data-category="${c.clinic}"><td>${dateThai(c.date)}</td><td>${esc(ACTIVITIES[c.activity]?.[0]||c.activity)}<div class="secondary">${esc(c.clinic)} · ตา${esc(c.eye)}</div></td><td>${esc(c.caseRef)}</td><td>${esc(c.supervisor)}</td><td>${btn('ดูรายละเอียด',`case/${c.id}`,'','small')}</td></tr>`).join(''))+`<div class="section-gap"><button class="btn" onclick="exportCases()">${icon('download')}ส่งออกประวัติ CSV</button></div>`;}
function caseForm(id){const c=state.cases.find(x=>x.id===id);return head(c?'แก้ไขบันทึกหัตถการ':'บันทึกหัตถการ','กรอกข้อมูลที่จำเป็นสำหรับติดตามประสบการณ์การฝึกอบรม',btn('กลับไป Logbook','logbook','book'))+`<div class="grid main-side"><div class="card pad"><form onsubmit="saveCase(event,'${c?.id||''}')"><div class="form-section"><h2>รายละเอียดเคส</h2><div class="form-grid">${field('วันที่ทำหัตถการ *','date',input('date',c?.date||TODAY,'date','required max="2026-12-31"'))}${field('คลินิก / Rotation *','clinic',select('clinic',CLINICS,c?.clinic||'Glaucoma',true))}${field('หัตถการ *','activity',select('activity',ACTIVITIES.map((a,i)=>[i,a[0]]),c?.activity??0,true),'',true)}${field('รหัสเคสตัวอย่าง *','caseRef',input('caseRef',c?.caseRef||'','text','required placeholder="DEMO-00123" maxlength="30"'),'ใช้รหัสสมมติ ไม่กรอก HN หรือชื่อผู้ป่วยจริง')}${field('ตาข้างที่ทำ','eye',select('eye',['ขวา','ซ้าย','ทั้งสองข้าง','ไม่เกี่ยวข้อง'],c?.eye||'ขวา'))}${field('ผู้กำกับดูแล *','supervisor',select('supervisor',INSTRUCTORS,c?.supervisor||activeInstructorName(),true),'อาจารย์หรือ fellow ตามสิทธิ์ที่หน่วยงานกำหนด',true)}${field('บันทึกเพิ่มเติม','note',textArea('note',c?.note||'','placeholder="สิ่งที่ได้เรียนรู้หรือข้อมูลประกอบที่ไม่ระบุตัวผู้ป่วย"'),'ห้ามระบุข้อมูลส่วนบุคคลของผู้ป่วย',true)}</div></div><div class="form-actions">${btn('ยกเลิก','logbook','')}<button type="submit" class="btn primary">${icon('check')}บันทึกข้อมูลตัวอย่าง</button></div></form></div><div><div class="card pad"><h2>การนับจำนวนเคส</h2><p class="small muted" style="margin-top:12px">แต่ละบันทึกนับเป็นหนึ่งประสบการณ์หัตถการ การสอบ EPA/DOPS จะบันทึกแยกเป็นคำขอประเมิน</p><div class="mini-list"><div><span>บันทึกข้อมูล</span>${tag('Logbook','teal')}</div><div><span>ขอประเมินทักษะ</span>${tag('EPA / DOPS','blue')}</div></div></div><div class="section-gap">${info('ข้อมูลที่บันทึกจะอยู่ในเบราว์เซอร์เครื่องนี้เท่านั้น ใช้ทดลองหน้าจอได้โดยไม่ส่งข้อมูลออกไป')}</div></div></div>`;}
function saveCase(e,id){e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.activity=+data.activity;if(state.cases.some(c=>c.id!==id&&c.caseRef===data.caseRef&&c.date===data.date&&+c.activity===data.activity)){toast('พบรหัสเคส วันที่ และหัตถการตรงกับรายการเดิม กรุณาตรวจสอบ');return}const obj={...data,id:id||'LOG'+Date.now(),status:'บันทึกแล้ว'};if(id)state.cases=state.cases.map(c=>c.id===id?obj:c);else state.cases.unshift(obj);recordAudit(id?'แก้ไข Logbook ตัวอย่าง':'เพิ่ม Logbook ตัวอย่าง');location.hash='case/'+obj.id;toast('บันทึกเคสตัวอย่างเรียบร้อยแล้ว')}
function caseDetail(id){const c=state.cases.find(x=>x.id===id);if(!c)return notFound();return head(ACTIVITIES[c.activity]?.[0]||'รายละเอียดหัตถการ',`Logbook ${esc(c.id)}`,btn('แก้ไขบันทึก',`edit-case/${c.id}`,'file')+btn('ขอประเมินจากเคสนี้',`new-request/${c.id}`,'check','primary'))+`<div class="grid main-side"><div class="card pad"><h2>ข้อมูลหัตถการ</h2><dl class="kv section-gap"><dt>วันที่ทำหัตถการ</dt><dd>${dateThai(c.date)}</dd><dt>รหัสเคสตัวอย่าง</dt><dd>${esc(c.caseRef)}</dd><dt>คลินิก</dt><dd>${esc(c.clinic)}</dd><dt>ตาข้างที่ทำ</dt><dd>${esc(c.eye)}</dd><dt>ผู้กำกับดูแล</dt><dd>${esc(c.supervisor)}</dd><dt>สถานะ</dt><dd>${statusTag(c.status)}</dd></dl><h3 class="section-gap">บันทึกเพิ่มเติม</h3><p class="small muted" style="margin-top:8px;white-space:pre-wrap">${esc(c.note||'ไม่มีบันทึกเพิ่มเติม')}</p></div><div class="card pad"><h2>การประเมินที่เชื่อมกับเคส</h2>${state.requests.filter(r=>r.caseId===c.id).map(r=>`<div class="metric-row"><span>${r.type}</span><a href="#request/${r.id}">ดูคำขอ →</a></div>`).join('')||`<p class="small muted section-gap">ยังไม่มีคำขอประเมินจากเคสนี้</p>`}<div class="section-gap">${btn('กลับ Logbook','logbook','arrow','small')}</div></div></div>`;}
function requestsPage(){const rows=state.requests.filter(r=>role!=='resident'||r.name===currentStudent());return head('คำขอประเมิน','ติดตามคำขอและผลการประเมินแต่ละครั้ง',btn('ขอรับการประเมิน','new-request','plus','primary'))+filters('ค้นหาแบบประเมิน',select('list-filter',[['','ทุกสถานะ'],['pending','รอประเมิน'],['done','ประเมินแล้ว'],['cancelled','ยกเลิก']],'',false,'onchange="filterRows()"'))+filterableTable(['วันที่ส่ง','แบบประเมิน','ผู้ประเมิน','สถานะ',''],rows.map(r=>`<tr data-filter-row data-category="${r.status}"><td>${dateThai(r.createdDate||r.date)}</td><td>${tag(r.type,'blue')}<div style="margin-top:5px">${esc(r.title)}</div></td><td>${esc(r.evaluator||activeInstructorName())}</td><td>${statusTag(r.status==='pending'?'รอประเมิน':r.status==='done'?'ประเมินแล้ว':'ยกเลิก')}</td><td>${btn('รายละเอียด',`request/${r.id}`,'','small')}</td></tr>`).join(''));}
function requestForm(caseId){const c=state.cases.find(x=>x.id===caseId);const selected=new URLSearchParams(location.hash.split('?')[1]||'').get('form')||'epa1';return head('ขอรับการประเมิน','เลือกแบบประเมินและอาจารย์ที่สังเกตการทำหัตถการ',btn('กลับรายการคำขอ','requests','arrow'))+`<div class="grid main-side"><div class="card pad"><form onsubmit="saveRequest(event,'${c?.id||''}')"><div class="form-grid">${field('แบบประเมิน *','form',select('form',FORMS.filter(f=>['EPA','DOPS'].includes(f.type)).map(f=>[f.id,`${f.id.toUpperCase()} · ${f.title}`]),selected,true),'ชั้นปีและเกณฑ์ใช้ข้อมูลจากเอกสารเดิมเพื่อสาธิต',true)}${field('วันที่ทำหัตถการ *','date',input('date',c?.date||TODAY,'date','required'))}${field('อาจารย์ผู้ประเมิน *','evaluator',select('evaluator',assessorNames(),activeInstructorName(),true))}${field('รหัสเคสตัวอย่าง','caseRef',input('caseRef',c?.caseRef||'','text','placeholder="DEMO-00123"'),'ไม่ใช้ HN จริง')}${field('วันครบกำหนดตัวอย่าง *','due',input('due','2026-09-23','date','required'))}${field('สิ่งที่ต้องการรับคำแนะนำ','message',textArea('message'),'ข้อมูลนี้ส่งให้อาจารย์พร้อมคำขอ',true)}</div><div class="form-actions">${btn('ยกเลิก','requests','')}<button class="btn primary" type="submit">${icon('check')}ส่งคำขอตัวอย่าง</button></div></form></div><div><div class="card pad"><h2>ก่อนขอรับการประเมิน</h2><div class="mini-list"><div>เลือกแบบให้ตรงกับหัตถการ</div><div>เลือกอาจารย์ที่เป็นผู้ประเมินจริง</div><div>ทบทวนผลครั้งก่อนและ Feedback</div></div><p class="small muted section-gap">เอกสารกำหนดอย่างน้อย 2 ครั้งกับอาจารย์คนละท่าน รายละเอียดการนับและวันครบกำหนดยังต้องยืนยัน</p></div><div class="section-gap">${info('ต้นแบบจะสร้างรายการในเครื่องนี้และแสดงตัวอย่างการแจ้งเตือน ไม่มีการส่ง Email หรือ LINE จริง')}</div></div></div>`;}
function saveRequest(e,caseId){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(d.due<d.date){toast('วันครบกำหนดต้องไม่ก่อนวันที่ทำหัตถการ');return}const f=formById(d.form);const r={...d,createdDate:TODAY,id:'A'+Date.now(),form:f.id,type:f.type,title:f.title,name:currentStudent(),year:'R1',status:'pending',caseId};state.requests.unshift(r);recordAudit('สร้างคำขอประเมินตัวอย่าง '+f.id.toUpperCase());location.hash='request/'+r.id;toast('สร้างคำขอตัวอย่างแล้ว สามารถเปลี่ยนมุมมองอาจารย์เพื่อประเมินได้')}
function requestDetail(id){const r=state.requests.find(x=>x.id===id);if(!r)return notFound();const a=state.assessments.find(x=>x.request===id);return head('รายละเอียดคำขอประเมิน',`${esc(r.id)} · ${esc(r.title)}`,btn('กลับคำขอ','requests','arrow'))+`<div class="grid main-side"><div class="card pad"><div class="actions">${tag(r.type,'blue')}${statusTag(r.status==='pending'?'รอประเมิน':r.status==='done'?'ประเมินแล้ว':'ยกเลิก')}</div><h2 style="margin-top:20px">${esc(r.title)}</h2><dl class="kv section-gap"><dt>ผู้เรียน</dt><dd>${esc(r.name)} · ${r.year}</dd><dt>วันที่ทำหัตถการ</dt><dd>${dateThai(r.date)}</dd><dt>ผู้ประเมิน</dt><dd>${esc(r.evaluator||activeInstructorName())}</dd><dt>ครบกำหนดตัวอย่าง</dt><dd>${dateThai(r.due)}</dd><dt>ข้อความถึงอาจารย์</dt><dd>${esc(r.message||'ไม่มีข้อความเพิ่มเติม')}</dd></dl><div class="form-actions">${r.status==='pending'?`<button class="btn danger" onclick="cancelRequest('${r.id}')">ยกเลิกคำขอ</button><button class="btn primary" onclick="goAs('instructor','evaluate/${r.id}')">ทดลองประเมินในมุมอาจารย์</button>`:a?btn('ดูผลประเมิน',`assessment/${a.id}`,'check','primary'):''}</div></div><div class="card pad"><h2>เส้นทางคำขอ</h2><div class="timeline section-gap"><div class="timeline-item"><span class="timeline-dot"></span><div>ส่งคำขอแล้ว<p>${dateThai(r.createdDate||r.date)}</p></div></div><div class="timeline-item"><span class="timeline-dot"></span><div>${r.status==='pending'?'รออาจารย์ประเมิน':r.status==='done'?'บันทึกผลแล้ว':'ยกเลิกคำขอแล้ว'}<p>สถานะในต้นแบบ</p></div></div></div></div></div>`;}
function cancelRequest(id){confirmDialog('ยกเลิกคำขอประเมิน','รายการนี้จะเปลี่ยนเป็นสถานะยกเลิก โดยยังคงประวัติไว้',()=>{const r=state.requests.find(r=>r.id===id);r.status='cancelled';recordAudit('ยกเลิกคำขอตัวอย่าง');render();toast('ยกเลิกคำขอแล้ว')})}
function assessmentForm(id,preview=false){const req=preview?null:state.requests.find(r=>r.id===id);const f=formById(preview?id:req?.form);if(!f)return notFound();if(req?.status==='done'){const a=state.assessments.find(a=>a.request===req.id);return head('รายการนี้ประเมินแล้ว')+info('ดูผลที่บันทึกไว้ได้ในประวัติการประเมิน')+btn('ดูผลประเมิน',`assessment/${a?.id}`,'check','primary')}if(req?.status==='cancelled')return head('คำขอนี้ถูกยกเลิกแล้ว')+btn('กลับงานรอประเมิน','queue','arrow');const draft=state.drafts?.[id];const isNumeric=f.type==='Long case';return head(`${f.type} · ${esc(f.title)}`,`${f.items.length} หัวข้อประเมิน ${f.year?'· '+esc(f.year)+' ตามเอกสารเดิม':''}`,btn(preview?'กลับคลังแบบประเมิน':'กลับรายการงาน',preview?'forms':'queue','arrow'))+info(preview?'ทดลองกรอกแบบประเมินจากหัวข้อในเอกสารเดิม ผลที่บันทึกเป็นข้อมูลสมมติในเบราว์เซอร์เครื่องนี้':'บันทึกผลรายข้อและข้อเสนอแนะให้ครบ ผลแต่ละครั้งจะเก็บแยกจากประวัติก่อนหน้า')+(f.type==='FEV-1'?info('FEV-1 ใช้คะแนนรายข้อ 0–4 ในเอกสารเดิม ต้นแบบยังไม่ตัดสินผ่าน/ไม่ผ่านจากคะแนนรวม','warning'):f.type==='DOPS'?info('เกณฑ์ในหัวแบบเดิม: ผ่านเมื่อทำถูกต้องสมบูรณ์ครบทุกข้อ หากผลรวมต่างจากรายข้อ ต้องบันทึกเหตุผลให้ชัดเจน','warning'):['EPA','Skill Board'].includes(f.type)?info('คะแนนรายข้อและ Level โดยรวมเป็นคนละส่วน ไม่มีการแปลงคะแนนเฉลี่ยเป็น Level โดยอัตโนมัติ'):info(f.type==='Glaucoma club'?'แสดงหัวข้อจากแบบเดิม บันทึกเป็นข้อความระหว่างรอยืนยันสเกลและเกณฑ์ผ่าน':'เก็บคะแนนตามหัวข้อเดิม เกณฑ์ผ่านและข้อที่ไม่ระบุคะแนนเต็มยังรอการยืนยัน','warning'))+`<form id="assessment-form" onsubmit="submitAssessment(event,'${f.id}','${req?.id||''}')"><div class="card pad"><h2>ข้อมูลการประเมิน</h2><div class="form-grid section-gap">${field('แพทย์ประจำบ้าน','residentName',input('residentName',draft?.residentName||req?.name||currentStudent(),'text','required'))}${field('ผู้ประเมิน','assessor',select('assessor',assessorNames(),draft?.assessor||req?.evaluator||activeInstructorName(),true))}${field('วันที่ประเมิน','assessedDate',input('assessedDate',draft?.assessedDate||TODAY,'date','required'))}${field('รูปแบบ','formType',input('formType',f.id.toUpperCase(),'text','readonly'))}</div></div><div class="card pad section-gap"><div class="toolbar"><h2>หัวข้อการประเมิน</h2><span class="tag gray">${f.items.length} ข้อ</span></div>${f.items.map((item,i)=>{const choices=item.choices||f.itemChoices;const label=esc(item.label).replace(/\*\*/g,'');return `<fieldset class="rubric-item" style="border:0;border-bottom:1px solid var(--line);margin:0;padding-left:0;padding-right:0"><legend class="rubric-label"><span class="item-number">${i+1}</span><span>${label}</span></legend><div class="rubric-choices">${choices?choices.map((ch,j)=>`<label class="choice"><input type="radio" name="item${i}" value="${esc(ch)}" ${String(draft?.['item'+i])===String(ch)?'checked':''} required><span>${esc(ch)}</span></label>`).join(''):isNumeric?`<label class="small">คะแนน ${item.max!=null?'(เต็ม '+item.max+')':'(ยังไม่ระบุคะแนนเต็ม)'} <input style="width:115px;margin-left:8px" class="input" type="number" name="item${i}" min="0" ${item.max!=null?`max="${item.max}"`:''} step="0.5" required value="${esc(draft?.['item'+i]||'')}" aria-label="คะแนนข้อ ${i+1}"></label>`:`<input class="input" name="item${i}" required placeholder="บันทึกข้อสังเกตของขั้นตอนนี้" aria-label="ข้อสังเกตข้อ ${i+1}" value="${esc(draft?.['item'+i]||'')}"><span class="small muted">บันทึกเป็นข้อความระหว่างรอยืนยันสเกลรายข้อ</span>`}</div></fieldset>`}).join('')}</div><div class="card pad section-gap"><h2>สรุปผลและคำแนะนำ</h2><div class="form-grid section-gap">${f.overall?.choices?.length?field('ผลโดยรวม *','overall',select('overall',[['','เลือกผลโดยรวม'],...f.overall.choices],draft?.overall||'',true),'เลือกผลโดยผู้ประเมิน ไม่คำนวณแทนการตัดสินใจ',true):''}${field('Feedback / คำแนะนำ *','feedback',textArea('feedback',draft?.feedback||'','required placeholder="จุดที่ทำได้ดี สิ่งที่ควรฝึกเพิ่มเติม และแนวทางพัฒนา"'),'',true)}${f.type==='DOPS'?field('เหตุผลประกอบ หากผลโดยรวมแตกต่างจากรายข้อ','override',textArea('override',draft?.override||''),'ต้นแบบจะให้ระบุเหตุผลเมื่อเลือกผ่านแต่มีข้อที่ยังไม่สมบูรณ์',true):''}${field('ได้ทบทวนร่วมกับผู้เรียน','reviewed',select('reviewed',['ได้ทบทวนแล้ว','ยังไม่ได้ทบทวน'],draft?.reviewed||'ได้ทบทวนแล้ว'))}${field('Self-reflection ของผู้เรียน','reflectionDone',select('reflectionDone',['ได้สะท้อนการเรียนรู้แล้ว','ยังไม่ได้สะท้อนการเรียนรู้'],draft?.reflectionDone||'ได้สะท้อนการเรียนรู้แล้ว'))}</div><div class="form-actions"><button class="btn" type="button" onclick="saveAssessmentDraft('${id}')">บันทึกร่างในเครื่อง</button><button class="btn primary" type="submit">${icon('check')}บันทึกผลประเมินตัวอย่าง</button></div></div></form>`;}
function saveAssessmentDraft(id){const f=document.getElementById('assessment-form');state.drafts=state.drafts||{};state.drafts[id]=Object.fromEntries(new FormData(f));persist();toast('บันทึกร่างในเบราว์เซอร์แล้ว กลับมาเปิดแบบนี้ต่อได้')}
function submitAssessment(e,formId,requestId){e.preventDefault();const f=formById(formId);const d=Object.fromEntries(new FormData(e.target));if(f.type==='DOPS'&&d.overall==='ผ่าน'&&f.items.some((_,i)=>d['item'+i]!==f.itemChoices[0])&&!d.override?.trim()){toast('มีรายข้อที่ยังไม่สมบูรณ์ กรุณาระบุเหตุผลประกอบผลผ่าน');document.getElementById('override')?.focus();return}let result=d.overall||(f.type==='Glaucoma club'?'บันทึกข้อสังเกตแล้ว':'บันทึกคะแนนแล้ว');if(result.startsWith('Level'))result=result.split(':')[0];if(f.type==='Long case'){const sum=f.items.reduce((n,_,i)=>n+Number(d['item'+i]),0);result=`${sum}${f.overall?.max?' / '+f.overall.max:''} คะแนน`}const id='E'+Date.now();state.assessments.unshift({id,request:requestId,form:formId,name:d.residentName,year:state.requests.find(r=>r.id===requestId)?.year||'R1',date:d.assessedDate,evaluator:d.assessor,result,feedback:d.feedback,answers:d,override:d.override||''});if(requestId){const r=state.requests.find(r=>r.id===requestId);r.status='done'}if(state.drafts)delete state.drafts[requestId||formId];recordAudit('บันทึกผลประเมินตัวอย่าง '+formId.toUpperCase());location.hash='assessment/'+id;toast('บันทึกผลประเมินแล้ว ประวัติครั้งก่อนยังคงอยู่')}
function historyPage(){const list=state.assessments.filter(a=>role!=='resident'||a.name===currentStudent());return head('ประวัติการประเมิน','ผลประเมินแต่ละครั้งและคำแนะนำจากอาจารย์',`<button class="btn" onclick="exportAssessments()">${icon('download')}ส่งออก CSV</button>`)+filters('ค้นหาชื่อหรือแบบประเมิน',select('list-filter',[['','ทุกประเภท'],['EPA','EPA'],['DOPS','DOPS'],['FEV-1','FEV-1'],['Long case','Long case'],['Skill Board','Skill Board']],'',false,'onchange="filterRows()"'))+filterableTable(['วันที่ประเมิน','ผู้เรียน / แบบประเมิน','ผู้ประเมิน','ผล',''],list.map(a=>`<tr data-filter-row data-category="${formById(a.form)?.type}"><td>${dateThai(a.date)}</td><td>${esc(a.name)}<div class="secondary">${a.form.toUpperCase()} · ${esc(formTitle(a.form))}</div></td><td>${esc(a.evaluator)}</td><td>${statusTag(displayResult(a))}</td><td>${btn('ดูผลและ Feedback',`assessment/${a.id}`,'','small')}</td></tr>`).join(''));}

function activityDetail(id){const a=state.activities.find(x=>x.id===id);if(!a)return notFound();const labels={note:'รายละเอียด / สิ่งที่ได้เรียนรู้',stage:'ระยะดำเนินงาน',strength:'สิ่งที่ทำได้ดี',improve:'สิ่งที่ต้องพัฒนา',next:'แผนติดตามครั้งถัดไป',advisorNote:'ข้อเสนอแนะจากอาจารย์',reflection:'Self-reflection ก่อนพบอาจารย์',learning:'กิจกรรมที่ต้องการเรียนรู้',kind:'ประเภทกิจกรรม',score:'คะแนน / จำนวน'};return head(esc(a.title),ACTIVITY_TYPES[a.type],btn('กลับรายการ',`activities/${a.type}`,'arrow')+btn('แก้ไขบันทึก',`activity-edit/${a.id}`,'file'))+`<div class="card pad"><div class="actions">${tag(ACTIVITY_TYPES[a.type],'blue')}${statusTag(a.status)}</div><dl class="kv section-gap"><dt>วันที่</dt><dd>${dateThai(a.date)}</dd><dt>อาจารย์ที่ปรึกษา</dt><dd>${esc(a.advisor)}</dd></dl>${Object.entries(labels).filter(([k])=>a[k]).map(([k,l])=>`<h2 class="section-gap">${l}</h2><p style="margin-top:10px;white-space:pre-wrap">${esc(a[k])}</p>`).join('')}</div>`;}
function calendarHTML(){return `<div class="calendar">${['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'].map(d=>`<div class="day-label">${d}</div>`).join('')}<div></div><div></div>${Array.from({length:30},(_,i)=>`<div class="${i===15?'today':''}"><strong>${i+1}</strong>${({1:'เริ่ม Rotation',18:'นัดประเมิน EPA',22:'ประชุมวิชาการ',23:'ประชุมวิชาการ',24:'พบอาจารย์',30:'สิ้นสุด Rotation'})[i+1]?`<div class="event">${({1:'เริ่ม Rotation',18:'นัดประเมิน EPA',22:'ประชุมวิชาการ',23:'ประชุมวิชาการ',24:'พบอาจารย์',30:'สิ้นสุด Rotation'})[i+1]}</div>`:''}</div>`).join('')}${Array.from({length:3},()=>'<div></div>').join('')}</div>`;}
function rotationPage(){return head(role==='admin'?'จัดการ Rotation':'Rotation และตารางฝึก','แผนฝึกตัวอย่าง ปีการศึกษา 2569',role==='admin'?`<button class="btn" onclick="generateMonthly()">${icon('check')}สร้างงาน FEV-1 ตัวอย่าง</button><button class="btn primary" onclick="rotationModal()">${icon('plus')}เพิ่ม Rotation</button>`:btn('วันลาและข้อยกเว้น','leave','calendar'))+`<div class="grid main-side">${card('กันยายน 2569',`<div class="card-body">${calendarHTML()}<p class="small muted section-gap">กำหนดการทั้งหมดเป็นตัวอย่างเพื่อแสดงการใช้งาน</p></div>`)}${card('Rotation ปัจจุบัน',`<div class="card-body">${tag('กำลังฝึก','teal')}<h2 class="section-gap">Glaucoma</h2><dl class="kv"><dt>ช่วงเวลา</dt><dd>1–30 ก.ย. 2569</dd><dt>ผู้ประเมิน</dt><dd>${activeInstructorName()}</dd><dt>ผู้เรียน</dt><dd>${role==='resident'?currentStudent():'กลุ่มผู้เรียนตัวอย่าง'}</dd></dl>${info('วันเริ่มนับ 15 วันและวิธีจัดการช่วงลาต้องยืนยันก่อนเปิดใช้การสร้างงานอัตโนมัติ','warning')}${btn('ดู / ขอวันลา','leave','calendar','small')}</div>`)}</div><div class="card section-gap"><div class="card-head"><h2>แผน Rotation รายเดือน</h2></div>${table(['เดือน','คลินิก / สายฝึก','ผู้ประเมิน','สถานะ',...(role==='admin'?['']:[])],state.rotations.map((r,i)=>`<tr><td>${esc(r.month)}</td><td>${esc(r.clinic)}</td><td>${esc(r.teacher)}</td><td>${statusTag(r.status)}</td>${role==='admin'?`<td><button class="btn small" onclick="rotationModal(${i})">แก้ไข</button></td>`:''}</tr>`).join(''))}</div>`;}
function rotationModal(index){const r=state.rotations[index];openDialog(r?'แก้ไข Rotation':'เพิ่ม Rotation',`<form onsubmit="saveRotation(event,${Number.isInteger(index)?index:-1})"><div class="form-grid">${field('เดือน / ปี *','month',input('month',r?.month||'ม.ค. 2570','text','required'))}${field('คลินิก','clinic',select('clinic',CLINICS,r?.clinic||CLINICS[0]))}${field('อาจารย์ผู้ประเมิน','teacher',select('teacher',assessorNames(),r?.teacher||activeInstructorName()))}${field('สถานะ','status',select('status',['ยังไม่เริ่ม','กำลังฝึก','ประเมินแล้ว'],r?.status||'ยังไม่เริ่ม'))}</div><div class="form-actions"><button type="button" class="btn" onclick="closeDialog()">ยกเลิก</button><button class="btn primary">บันทึก Rotation</button></div></form>`)}
function saveRotation(e,i){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(i<0)state.rotations.push(d);else state.rotations[i]=d;recordAudit('ปรับแผน Rotation ตัวอย่าง');closeDialog();render();toast('บันทึก Rotation แล้ว')}
function generateMonthly(){openDialog('สร้างงาน FEV-1 ตัวอย่าง',`<p>สาธิตการสร้างงานเมื่อสิ้นสุด Rotation เดือนกันยายน ระบบจะยังไม่ตั้งงานอัตโนมัติจริง</p><form onsubmit="confirmMonthly(event)"><div class="form-grid">${field('อาจารย์ผู้ประเมิน','evaluator',select('evaluator',assessorNames(),activeInstructorName()))}${field('วันครบกำหนดตัวอย่าง','due',input('due','2026-10-15','date','required'))}</div><p class="section-gap">สร้างให้ผู้เรียนตัวอย่าง ${state.users.filter(u=>u.role==='resident'&&u.active).length} คน โดยไม่นับรายการเดิมซ้ำ</p><div class="form-actions"><button type="button" class="btn" onclick="closeDialog()">ยกเลิก</button><button class="btn primary">สร้างงานตัวอย่าง</button></div></form>`)}
function confirmMonthly(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(d.due<'2026-09-30'){toast('วันครบกำหนดต้องไม่ก่อนสิ้นสุด Rotation ตัวอย่าง');return}let n=0;state.users.filter(u=>u.role==='resident'&&u.active).forEach(u=>{const key='SEP26-'+u.id;if(!state.requests.some(r=>r.rotationKey===key)){state.requests.push({id:'M'+Date.now()+u.id,name:u.name,year:u.year,type:'FEV-1',form:'fev1',title:'Rotation กันยายน · Glaucoma',date:'2026-09-30',due:d.due,status:'pending',evaluator:d.evaluator,rotationKey:key});n++}});recordAudit(`สร้างงาน FEV-1 ตัวอย่าง ${n} รายการ`);closeDialog();render();toast(n?`สร้าง ${n} รายการแล้ว`:'มีงานตัวอย่างของรอบนี้ครบแล้ว ไม่มีการสร้างซ้ำ')}
function leavePage(){const rows=state.leaves.filter(l=>role!=='resident'||l.name===currentStudent());return head('วันลาและข้อยกเว้น','การอนุมัติวันลาและผลต่อการประเมินเป็นคนละขั้นตอน',btn('เพิ่มคำขอลา','new-leave','plus','primary'))+info('วันลาไม่ทำให้ยกเว้นการประเมินทั้ง Rotation โดยอัตโนมัติ ผู้ดูแลต้องระบุผลตามเกณฑ์ที่ตกลง','warning')+`<div class="card">${table(['ผู้เรียน','ประเภท / ช่วงเวลา','สถานะ','ผลต่อการประเมิน',''],rows.map(l=>`<tr><td>${esc(l.name)}</td><td>${esc(l.type)}<div class="secondary">${dateThai(l.start)} – ${dateThai(l.end)}</div></td><td>${statusTag(l.status)}</td><td>${esc(l.effect)}</td><td>${role==='admin'?`<button class="btn small" onclick="leaveDecision('${l.id}')">พิจารณา</button>`:`<button class="btn small" onclick="leaveDetail('${l.id}')">รายละเอียด</button>`}</td></tr>`).join(''))}${!rows.length?empty('ยังไม่มีคำขอลา','เพิ่มคำขอลาเพื่อทดลองขั้นตอน'):''}</div>`;}
function leaveForm(){return head('เพิ่มคำขอลา','ระบุช่วงเวลาและเหตุผลสำหรับผู้ดูแลพิจารณา',btn('กลับรายการวันลา','leave','arrow'))+`<div class="card pad"><form onsubmit="saveLeave(event)"><div class="form-grid">${field('ผู้เรียน','name',select('name',role==='admin'?state.users.filter(u=>u.role==='resident').map(u=>u.name):[currentStudent()],currentStudent()))}${field('ประเภทวันลา','type',select('type',['ประชุมวิชาการ','ลาพักผ่อน','ลาป่วย','Elective / ฝึกนอกสถานที่','อื่น ๆ'],'ประชุมวิชาการ'))}${field('วันที่เริ่ม *','start',input('start','2026-09-22','date','required'))}${field('วันที่สิ้นสุด *','end',input('end','2026-09-23','date','required'))}${field('เหตุผลประกอบ *','reason',textArea('reason','','required'),'',true)}</div><div class="form-actions">${btn('ยกเลิก','leave','')}<button class="btn primary">ส่งคำขอลาตัวอย่าง</button></div></form></div>`;}
function saveLeave(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(d.end<d.start){toast('วันที่สิ้นสุดต้องไม่ก่อนวันที่เริ่ม');return}if(state.leaves.some(l=>l.name===d.name&&l.status!=='ไม่อนุมัติ'&&d.start<=l.end&&d.end>=l.start)){toast('ช่วงวันลาทับซ้อนกับรายการเดิม กรุณาตรวจสอบ');return}state.leaves.unshift({...d,id:'L'+Date.now(),status:'รอพิจารณา',effect:'ยังไม่กำหนด'});recordAudit('สร้างคำขอลาตัวอย่าง');location.hash='leave';toast('ส่งคำขอลาตัวอย่างแล้ว')}
function leaveDetail(id){const l=state.leaves.find(l=>l.id===id);openDialog('รายละเอียดคำขอลา',`<dl class="kv"><dt>ผู้เรียน</dt><dd>${esc(l.name)}</dd><dt>ประเภท</dt><dd>${esc(l.type)}</dd><dt>ช่วงเวลา</dt><dd>${dateThai(l.start)} – ${dateThai(l.end)}</dd><dt>เหตุผล</dt><dd>${esc(l.reason)}</dd><dt>สถานะ</dt><dd>${statusTag(l.status)}</dd><dt>ผลต่อการประเมิน</dt><dd>${esc(l.effect)}</dd></dl><div class="form-actions"><button class="btn" onclick="closeDialog()">ปิด</button><button class="btn primary" onclick="closeDialog();goAs('admin','leave')">ทดลองมุมผู้ดูแล</button></div>`)}
function leaveDecision(id){const l=state.leaves.find(l=>l.id===id);openDialog('พิจารณาวันลาและผลต่อการประเมิน',`<p>${esc(l.name)} · ${dateThai(l.start)} – ${dateThai(l.end)}<br>${esc(l.reason)}</p><form onsubmit="saveLeaveDecision(event,'${id}')"><div class="form-grid">${field('ผลพิจารณา','status',select('status',['อนุมัติแล้ว','ไม่อนุมัติ','รอพิจารณา'],l.status))}${field('ผลต่อการประเมิน','effect',select('effect',['ยังไม่กำหนด','ยังต้องประเมินตามรอบเดิม','เสนอเลื่อนกำหนดส่ง','เสนอขอยกเว้นเฉพาะรอบ'],l.effect))}${field('เหตุผลการพิจารณา *','decisionNote',textArea('decisionNote',l.decisionNote||'','required'),'',true)}</div><p class="section-gap">การเลือกเสนอเลื่อนหรือยกเว้นจะบันทึกข้อเสนอไว้ให้พิจารณา ยังไม่แก้วันครบกำหนดหรือยกเว้นงานประเมิน</p><div class="form-actions"><button type="button" class="btn" onclick="closeDialog()">ยกเลิก</button><button class="btn primary">บันทึกผลพิจารณา</button></div></form>`)}
function saveLeaveDecision(e,id){e.preventDefault();Object.assign(state.leaves.find(l=>l.id===id),Object.fromEntries(new FormData(e.target)));recordAudit('บันทึกผลพิจารณาวันลาตัวอย่าง');closeDialog();render();toast('บันทึกผลพิจารณาแล้ว')}
function residentsPage(){const list=state.users.filter(u=>u.role==='resident');return head('ผู้เรียนในความดูแล','ภาพรวมและประวัติการประเมินรายบุคคล')+filters('ค้นหาผู้เรียน',select('list-filter',[['','ทุกชั้นปี'],'R1','R2','R3'],'',false,'onchange="filterRows()"'))+`<div class="grid three">${list.map(u=>{const pending=state.requests.filter(r=>r.name===u.name&&r.status==='pending').length;return `<div class="card pad" data-filter-row data-category="${u.year}"><div class="person"><span class="avatar teal">${u.year}</span><div><h2 style="font-size:16px">${esc(u.name)}</h2><p class="small muted">${esc(u.id)} · ${u.year}</p></div></div><div class="metric-row"><span>รอประเมิน</span>${tag(pending+' รายการ',pending?'orange':'gray')}</div><div class="metric-row"><span>ประเมินแล้ว</span><strong>${state.assessments.filter(a=>a.name===u.name).length} ครั้ง</strong></div><div class="section-gap">${btn('ดูแฟ้มผู้เรียน',`resident/${u.id}`,'arrow','small')}</div></div>`}).join('')}</div><div id="filter-empty" hidden>${empty('ไม่พบผู้เรียน','ลองเปลี่ยนคำค้นหาหรือชั้นปี')}</div>`;}
function residentDetail(id){const u=state.users.find(u=>u.id===id);if(!u)return notFound();const as=state.assessments.filter(a=>a.name===u.name);const rs=state.requests.filter(r=>r.name===u.name&&r.status==='pending');return head(esc(u.name),`รหัส ${esc(u.id)} · แพทย์ประจำบ้าน ${u.year}`,btn('กลับรายชื่อ','residents','users'))+`<div class="stats">${stat('คำขอรอประเมิน',rs.length,'เฉพาะผู้เรียนคนนี้','check')}${stat('ผลประเมินที่ได้รับ',as.length,'ทุกประเภทการประเมิน','chart')}${stat('อาจารย์ผู้ประเมิน',new Set(as.map(a=>a.evaluator)).size,'ผู้ประเมินที่ไม่ซ้ำกัน','users')}${stat('ชั้นปี',u.year,'เกณฑ์ผูกกับรุ่นและปีการศึกษา','book')}</div><div class="grid main-side">${card('ประวัติการประเมิน',as.length?table(['วันที่','รายการ','ผล',''],as.map(a=>`<tr><td>${dateThai(a.date)}</td><td>${a.form.toUpperCase()} · ${esc(formTitle(a.form))}</td><td>${statusTag(a.result)}</td><td>${btn('ดูผล',`assessment/${a.id}`,'','small')}</td></tr>`).join('')):empty('ยังไม่มีผลประเมิน','รายการตัวอย่างของผู้เรียนคนนี้ยังไม่มีผล'))}${card('ข้อมูลผู้เรียน',`<div class="card-body"><dl class="kv"><dt>Email ตัวอย่าง</dt><dd style="overflow-wrap:anywhere">${esc(u.email)}</dd><dt>ชั้นปี</dt><dd>${u.year}</dd><dt>ที่ปรึกษา</dt><dd>${activeInstructorName()}</dd><dt>สถานะบัญชี</dt><dd>${statusTag(u.active?'ใช้งาน':'ระงับ')}</dd></dl></div>`)}</div><div class="section-gap">${card('คำขอที่ยังรอประเมิน',rs.length?table(['ผู้เรียน','แบบประเมิน','ครบกำหนด',''],requestRows(rs)):empty('ไม่มีงานรอประเมิน','ผู้เรียนคนนี้ไม่มีคำขอค้างในตัวอย่าง'))}</div>`;}
function usersPage(){return head('จัดการผู้ใช้งาน','บัญชีแพทย์ประจำบ้าน อาจารย์ และผู้ดูแล',`<button class="btn primary" onclick="userModal()">${icon('plus')}เพิ่มผู้ใช้งาน</button>`)+filters('ค้นหาชื่อ รหัส หรือ Email',select('list-filter',[['','ทุกบทบาท'],...Object.entries(roles)],'',false,'onchange="filterRows()"'))+filterableTable(['รหัส / ชื่อ','บทบาท','Email ตัวอย่าง','สถานะ',''],state.users.map(u=>`<tr data-filter-row data-category="${u.role}"><td>${esc(u.name)}<div class="secondary">${esc(u.id)} · ${u.year}</div></td><td>${roles[u.role]}</td><td>${esc(u.email)}</td><td>${statusTag(u.active?'ใช้งาน':'ระงับ')}</td><td><button class="btn small" onclick="userModal('${u.id}')">แก้ไข</button></td></tr>`).join(''));}
function userModal(id){const u=state.users.find(u=>u.id===id);openDialog(u?'แก้ไขผู้ใช้งาน':'เพิ่มผู้ใช้งานตัวอย่าง',`<form onsubmit="saveUser(event,'${u?.id||''}')"><div class="form-grid">${field('ชื่อที่แสดง *','name',input('name',u?.name||'','text','required placeholder="ชื่อสมมติ"'))}${field('บทบาท','role',select('role',Object.entries(roles),u?.role||'resident'))}${field('Email ตัวอย่าง *','email',input('email',u?.email||'','email','required placeholder="demo@example.test"'))}${field('ชั้นปี','year',select('year',['R1','R2','R3','—'],u?.year||'R1'))}${field('สถานะ','active',select('active',[['true','ใช้งาน'],['false','ระงับ']],String(u?.active??true)))}</div><div class="form-actions"><button type="button" class="btn" onclick="closeDialog()">ยกเลิก</button><button class="btn primary">บันทึกผู้ใช้งาน</button></div></form>`)}
function saveUser(e,id){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(state.users.some(u=>u.id!==id&&u.email.toLowerCase()===d.email.toLowerCase())){toast('Email นี้มีอยู่แล้วในข้อมูลตัวอย่าง');return}d.active=d.active==='true';if(d.role!=='resident')d.year='—';d.id=id||'U'+Date.now();if(id){const old=state.users.find(u=>u.id===id);state.requests.forEach(r=>{if(r.name===old.name)r.name=d.name;if(r.evaluator===old.name)r.evaluator=d.name});state.assessments.forEach(a=>{if(a.name===old.name)a.name=d.name;if(a.evaluator===old.name)a.evaluator=d.name});state.leaves.forEach(l=>{if(l.name===old.name)l.name=d.name});state.users=state.users.map(u=>u.id===id?d:u)}else state.users.push(d);recordAudit('ปรับปรุงผู้ใช้งานตัวอย่าง');closeDialog();render();toast('บันทึกผู้ใช้งานตัวอย่างแล้ว')}

function reportsPage(){const reportType=new URLSearchParams(location.hash.split('?')[1]||'').get('type')||'assessments';const filtersHTML=`<form class="toolbar" onsubmit="applyReport(event)"><div class="filters">${select('reportType',[['assessments','ผลการประเมิน'],['pending','งานรอประเมิน'],['cases','Logbook'],['progress','จำนวนเคสเทียบขั้นต่ำ']],reportType)}${select('reportYear',[['all','ทุกชั้นปี'],'R1','R2','R3'],new URLSearchParams(location.hash.split('?')[1]||'').get('year')||'all')}<button class="btn primary">แสดงรายงาน</button></div><button type="button" class="btn" onclick="exportCurrentReport()">${icon('download')}ส่งออก CSV</button></form>`;const yr=new URLSearchParams(location.hash.split('?')[1]||'').get('year')||'all';let content='';if(reportType==='assessments'){const list=state.assessments.filter(a=>(yr==='all'||a.year===yr)&&(role!=='resident'||a.name===currentStudent()));content=table(['วันที่','ผู้เรียน','ชั้นปี','แบบประเมิน','ผู้ประเมิน','ผล'],list.map(a=>`<tr><td>${dateThai(a.date)}</td><td>${esc(a.name)}</td><td>${a.year}</td><td>${a.form.toUpperCase()}</td><td>${esc(a.evaluator)}</td><td>${statusTag(displayResult(a))}</td></tr>`).join(''))}else if(reportType==='pending'){const list=state.requests.filter(r=>r.status==='pending'&&(yr==='all'||r.year===yr)&&(role!=='resident'||r.name===currentStudent()));content=table(['ผู้เรียน','ชั้นปี','แบบประเมิน','ครบกำหนด'],list.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.year}</td><td>${esc(r.title)}</td><td>${dateThai(r.due)}</td></tr>`).join(''))}else if(reportType==='cases'){content=yr==='all'||yr==='R1'?table(['วันที่','ผู้เรียน','หัตถการ','รหัสตัวอย่าง'],[...state.cases].slice(0,30).map(c=>`<tr><td>${dateThai(c.date)}</td><td>${currentStudent()}</td><td>${esc(ACTIVITIES[c.activity][0])}</td><td>${esc(c.caseRef)}</td></tr>`).join('')):empty('ยังไม่มี Logbook ตัวอย่างของชั้นปีนี้','ข้อมูล Logbook สำหรับสาธิตเป็นของผู้เรียน R1')}else content=yr==='all'||yr==='R1'?table(['หัตถการ','ทำแล้ว','ขั้นต่ำ','ยังขาด function csvDownload(name,headers,rows){const safe=v=>{let s=String(v??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const str='\ufeff'+[headers,...rows].map(r=>r.map(safe).join(',')).join('\r\n');const a=document.createElement('a');const url=URL.createObjectURL(new Blob([str],{type:'text/csv;charset=utf-8;'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('ดาวน์โหลดข้อมูลตัวอย่างแล้ว')}

function parseCSV(text){const rows=[];let row=[],value='',quote=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(quote&&text[i+1]==='"'){value+='"';i++}else quote=!quote}else if(ch===','&&!quote){row.push(value);value=''}else if((ch==='\n'||ch==='\r')&&!quote){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(value);if(row.some(x=>x.trim()))rows.push(row);row=[];value=''}else value+=ch}if(quote)throw new Error('เครื่องหมายคำพูดใน CSV ไม่ครบคู่');row.push(value);if(row.some(x=>x.trim()))rows.push(row);return rows}
async function previewImport(file){const out=document.getElementById('import-result');importPreview=[];if(!file)return;if(file.size>1048576){out.innerHTML=info('ไฟล์ใหญ่เกิน 1 MB','warning');return}try{const rows=parseCSV((await file.text()).replace(/^\ufeff/,''));const h=rows.shift()?.map(s=>s.trim());if(!h||['name','email','role','year'].some(k=>!h.includes(k)))throw new Error('หัวคอลัมน์ต้องมี name, email, role และ year');const seen=new Set(state.users.map(u=>u.email.toLowerCase()));importPreview=rows.map((r,i)=>{const d=Object.fromEntries(h.map((k,j)=>[k,(r[j]||'').trim()]));let problem='';if(!d.name||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)||!roles[d.role])problem='ชื่อ Email หรือบทบาทไม่ถูกต้อง';else if(d.role==='resident'&&!['R1','R2','R3'].includes(d.year))problem='ชั้นปีไม่ถูกต้อง';else if(seen.has(d.email.toLowerCase()))problem='Email ซ้ำ';seen.add(d.email.toLowerCase());return {...d,row:i+2,problem}});const ok=importPreview.filter(r=>!r.problem).length;out.innerHTML=`<h2>2. ตรวจข้อมูล ${importPreview.length} แถว</h2><p class="small muted section-gap">พร้อมนำเข้า ${ok} แถว · ต้องแก้ไข ${importPreview.length-ok} แถว</p>${table(['แถว','ชื่อ','สถานะ'],importPreview.map(r=>`<tr><td>${r.row}</td><td>${esc(r.name)}</td><td>${tag(r.problem||'พร้อมนำเข้า',r.problem?'red':'teal')}</td></tr>`).join(''))}<div class="section-gap"><button class="btn primary" onclick="commitImport()" ${!ok?'disabled':''}>นำเข้าเฉพาะ ${ok} แถวที่พร้อม</button></div>`}catch(e){out.innerHTML=info(esc(e.message),'warning')}}
function commitImport(){const ok=importPreview.filter(r=>!r.problem);if(!ok.length)return;ok.forEach((u,i)=>state.users.push({id:'IM'+Date.now()+i,name:u.name,email:u.email,role:u.role,year:u.role==='resident'?u.year:'—',active:true}));recordAudit(`นำเข้ารายชื่อสมมติ ${ok.length} คน`);importPreview=[];location.hash='users';toast('นำเข้ารายชื่อในต้นแบบเรียบร้อยแล้ว')}

ref="#${id}" ${active===id?'aria-current="page"':''} class="${active===id?'active':''}">${icon(ico)}<span>${id==='dashboard'?'ภาพรวม':id==='portfolio'?'E-portfolio':id==='rotation'?'ตาราง':id==='new-case'?'บันทึก':label}</span></a>`).join('')}<button onclick="toggleMenu(true)" aria-label="เมนูเพิ่มเติม">${icon('menu')}<span>เพิ่มเติม</span></button></nav></div>`;

function migrateLegacyResearch(){
  state.researchProjects ||= [];
  for(const a of state.activities.filter(a=>a.type==='research')){
    if(state.researchProjects.some(p=>p.legacyActivityId===a.id))continue;
    state.researchProjects.push({id:'LEGACY-'+a.id,legacyActivityId:a.id,needsProjectTitle:true,residentId:a.residentId||'R001',title:a.title,advisorId:state.users.find(u=>u.role==='instructor'&&u.name===a.advisor)?.id||'',legacyAdvisor:a.advisor||'',updates:[{id:'LEGACY-UP-'+a.id,date:a.date,stage:a.status||'บันทึกเดิม',progress:a.note||'',next:a.next||'',note:'ย้ายจากบันทึกงานวิจัยใน E-portfolio เดิมโดยคงข้อความและวันที่'}]});
  }
}

</script><script>
'use strict';
const REVIEW_TRACKS={R1:['OPRC','Retina1','Retina2','Cornea1','Cornea2','Patho1','Patho2','Glaucoma','Muscle1','Muscle2'],R2:['Glau1','Glau2','OPRC','Cornea1','Cornea2','R-Muscle1','R-Muscle2','R-Neuro1','R-Neuro2','R-WARD'],R3:['Retina1','R/US','Cornea1','Cornea2','R/ROP','Retina2','Glau1','Glau2','OPRC1','OPRC2']};
// Match only the unit/track labels present in the supplied timetable; do not infer mixed-unit rosters.
function trackMatchesUnit(track,name){
  if(!track)return true;
  const groups={Cornea:['Cornea1','Cornea2'],Glaucoma:['Glaucoma','Glau1','Glau2'],Retina:['Retina1','Retina2'],Retina1:['Retina1'],Retina2:['Retina2'],OPRC:['OPRC','OPRC1','OPRC2'],Patho:['Patho1','Patho2'],Muscle:['Muscle1','Muscle2'],'R-Muscle':['R-Muscle1','R-Muscle2'],'R-Neuro':['R-Neuro1','R-Neuro2'],Ward:['R-WARD'],'R/ROP':['R/ROP'],'R/US':['R/US']};
  return !groups[name]||groups[name].includes(track);
}
function initScheduleReview(){
  ['OPRC','Patho','Muscle','Ward','R-Muscle','R-Neuro','R/ROP','Retina2','Retina1','R/US'].forEach(name=>{if(!state.units.some(u=>u.name===name))state.units.push({id:reviewUID('UNIT'),name,staffIds:[]});});
  state.weeklySchedule ||= [{id:'WEEK01',year:'R1',track:'OPRC',day:'จันทร์',session:'AM',task:'OPD ตัวอย่าง',start:'09:00',end:'12:00',note:'ตารางสมมติสำหรับทดลอง ไม่ใช่ตารางปฏิบัติงานจริง'}];
  state.schedule.forEach(r=>{r.track ||= '';});state.weeklySchedule.forEach(w=>{w.academicYear ||= '2569';});
  initLinkedScheduleExamples();
}
const unitName = id => state.units.find(u=>u.id===id)?.name || 'ยังไม่กำหนดหน่วย';
const staffName = id => state.users.find(u=>u.id===id)?.name || 'ไม่พบบัญชีอาจารย์';
const scheduleResident = r => state.users.find(u=>u.id===r.residentId);
const scheduleRows = () => state.schedule.filter(r=>role!=='resident'||r.residentId===currentResident()?.id);
function scheduleStatus(r){return r.end<TODAY?'สิ้นสุดแล้ว':r.start>TODAY?'ยังไม่เริ่ม':'กำลังปฏิบัติงาน';}
function scheduleLink(r){const u=scheduleResident(r);return `<button class="rotation-chip ${r.type.toLowerCase()}" onclick="scheduleModal('${r.id}')"><strong>${esc(u?.name||r.residentId)}</strong><br>${esc(r.track||unitName(r.unitId))}<br><small>${dateThai(r.start)} - ${dateThai(r.end)}</small></button>`;}
function rotationPage(){
  const p=reviewParams(),view=p.get('view')||'monthly',ay=p.get('ay')||currentAcademicYear(),year=p.get('year')||'all',month=p.get('month')||TODAY.slice(0,7);
  let rows=scheduleRows().filter(r=>year==='all'||r.year===year);
  const title=role==='resident'?'Rotation – Elective/Vacation/PL':role==='chief'?'จัดการตารางปฏิบัติงาน':'ตารางปฏิบัติงาน';
  const tabs=`<div class="tabs">${[['monthly','Rotation รายเดือน'],['weekly','ตารางเช้า / บ่าย'],['placements','Elective / Vacation / PL / บ้านแพ้ว']].map(([id,label])=>`<a href="#rotation?view=${id}&ay=${ay}&year=${year}&month=${month}" class="${id===view?'active':''}">${label}</a>`).join('')}</div>`;
  const toolbar=`<form class="review-toolbar" onsubmit="scheduleFilter(event)"><input type="hidden" name="view" value="${view}">${field('ปีการศึกษา','ay',input('ay',ay,'number','min="2500" max="2700" required'))}${role==='resident'?'':field('ชั้นปี ณ รอบฝึก','year',select('year',[['all','ทุกชั้นปี'],'R1','R2','R3'],year))}${field('เดือนที่ดู','month',input('month',month,'month','required'))}<button class="btn primary">แสดงตาราง</button></form>`;
  let content='';
  if(view==='weekly'){
    const yrs=role==='resident'?[...new Set(rows.filter(r=>r.type==='Rotation'&&r.start<=monthEnd(month)&&r.end>=month+'-01').map(r=>r.year))]:year==='all'?['R1','R2','R3']:[year];
    const ownTracks=rows.filter(r=>r.type==='Rotation'&&r.start<=monthEnd(month)&&r.end>=month+'-01').map(r=>r.year+'|'+r.track).filter(Boolean);
    content=yrs.map(yr=>{const tracks=role==='resident'?REVIEW_TRACKS[yr].filter(t=>ownTracks.includes(yr+'|'+t)):REVIEW_TRACKS[yr];
      if(!tracks.length)return `<div class="card pad">${empty('ยังไม่กำหนดสายย่อยในรอบนี้','Chief Resident สามารถกำหนดสายย่อยในรายการ Rotation ได้')}</div>`;
      return `<section class="card section-gap weekly-grid"><div class="card-head"><h2>${yr} · แม่แบบสัปดาห์ ปี ${esc(ay)}</h2></div>${table(['วัน / ช่วง',...tracks],['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์'].flatMap(day=>['AM','PM'].map(session=>`<tr><th>${day}<br>${session}</th>${tracks.map(track=>{const w=state.weeklySchedule.find(w=>w.academicYear===ay&&w.year===yr&&w.track===track&&w.day===day&&w.session===session);return `<td>${w?`<strong>${esc(w.task)}</strong><div class="secondary">${esc(w.start)}${w.end?' - '+esc(w.end):''}</div><div class="secondary">${esc(w.note)}</div>`:'<span class="muted">ยังไม่กำหนด</span>'}${canSchedule()?`<button class="btn small" onclick="weeklyModal('${yr}','${track}','${day}','${session}','${ay}')">${w?'แก้ไข':'เพิ่ม'}</button>`:''}</td>`;}).join('')}</tr>`)).join(''))}</section>`;
    }).join('');
    if(!yrs.length)content=empty('ไม่มี Rotation ในเดือนที่เลือก','เลือกเดือนที่มีตารางฝึก');
    content='<p class="review-note">สายย่อยกำหนดโดย Chief Resident โดยตรง ช่องที่ยังไม่มีข้อมูลจะแสดงว่าง และไม่อนุมานสายจากลำดับชื่อผู้เรียน</p>'+content;
  }else if(view==='placements'){
    rows=rows.filter(r=>r.type!=='Rotation'&&r.start<=monthEnd(month)&&r.end>=month+'-01');
    content=`<div class="review-list">${rows.length?rows.map(r=>`<article class="review-record"><div class="actions">${tag(r.type,'blue')}${tag(r.year,'gray')}</div><h3>${esc(scheduleResident(r)?.name)}</h3><p>${dateThai(r.start)} - ${dateThai(r.end)}</p><p>${esc(r.location)}</p><p class="small muted">${esc(r.note)}</p><button class="btn small" onclick="scheduleModal('${r.id}')">${canSchedule()?'แก้ไข':'รายละเอียด'}</button></article>`).join(''):empty('ยังไม่มีรายการในเดือนนี้','แสดง Elective, Vacation, Personalized Learning และบ้านแพ้ว')}</div>`;
  }else{
    const startYear=Number(ay)-543;
    const months=Array.from({length:12},(_,i)=>{const d=new Date(startYear,6+i,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;});
    const usedUnits=state.units.filter(u=>rows.some(r=>r.type==='Rotation'&&r.unitId===u.id&&months.some(m=>r.start<=monthEnd(m)&&r.end>=m+'-01')));
    const selected=rows.filter(r=>r.type==='Rotation'&&r.start<=monthEnd(month)&&r.end>=month+'-01');
    content=`<section class="card pad"><h2>${prettyMonth(month)}</h2><div class="review-grid section-gap">${selected.length?selected.map(r=>`<article class="review-record"><div class="actions">${tag(r.year,'blue')}${tag(scheduleStatus(r),'teal')}</div><h3>${esc(scheduleResident(r)?.name)}</h3><p><strong>${esc(unitName(r.unitId))}</strong> ${esc(r.track)}</p><p class="small">${dateThai(r.start)} - ${dateThai(r.end)}</p><p class="small muted">ทีม: ${(state.units.find(u=>u.id===r.unitId)?.staffIds||[]).map(staffName).map(esc).join(', ')||'รอกำหนดอาจารย์ในหน่วย'}</p><button class="btn small" onclick="scheduleModal('${r.id}')">${canSchedule()?'แก้ไข':'รายละเอียด'}</button></article>`).join(''):empty('ยังไม่มี Rotation ในเดือนนี้','เลือกเดือนอื่นหรือให้ Chief Resident เพิ่มตาราง')}</div></section><section class="card section-gap matrix"><div class="card-head"><h2>ภาพรวมรายเดือน · ปีการศึกษา ${esc(ay)}</h2></div>${table(['เดือน',...usedUnits.map(u=>esc(u.name))],months.map(m=>`<tr><th>${prettyMonth(m)}</th>${usedUnits.map(u=>`<td>${rows.filter(r=>r.type==='Rotation'&&r.unitId===u.id&&r.start<=monthEnd(m)&&r.end>=m+'-01').map(scheduleLink).join('')||'<span class="muted">—</span>'}</td>`).join('')}</tr>`).join(''))}</section>`;
  }
  return head(title,role==='resident'?'ตารางของฉัน':'ตารางของ Resident ทุกคน',canSchedule()?`<button class="btn" onclick="unitTeamModal()">${icon('users')}ทีมอาจารย์</button><button class="btn primary" onclick="scheduleModal()">${icon('plus')}เพิ่มตาราง</button>`:'')+tabs+toolbar+content;
}
function scheduleFilter(e){e.preventDefault();location.hash='rotation?'+new URLSearchParams(new FormData(e.target)).toString();}
function scheduleModal(id){
  const r=state.schedule.find(r=>r.id===id);
  if(!canSchedule()){if(!r||(role==='resident'&&r.residentId!==currentResident()?.id))return;openDialog('รายละเอียดตารางปฏิบัติงาน',`<dl class="kv"><dt>Resident</dt><dd>${esc(scheduleResident(r)?.name)}</dd><dt>ประเภท</dt><dd>${esc(r.type)}</dd><dt>หน่วย / สายย่อย</dt><dd>${esc(unitName(r.unitId))} ${esc(r.track)}</dd><dt>ช่วงเวลา</dt><dd>${dateThai(r.start)} - ${dateThai(r.end)}</dd><dt>สถานที่</dt><dd>${esc(r.location)}</dd><dt>หมายเหตุ</dt><dd>${esc(r.note)||'—'}</dd></dl><button class="btn" onclick="closeDialog()">ปิด</button>`);return;}
  openDialog(r?'แก้ไขตารางปฏิบัติงาน':'เพิ่มตารางปฏิบัติงาน',`<form onsubmit="saveSchedule(event,'${r?.id||''}')"><div class="form-grid">${field('Resident','residentId',select('residentId',residentUsers().map(u=>[u.id,`${u.name} · ${u.year}`]),r?.residentId||currentResident()?.id,true))}${field('ชั้นปี ณ รอบฝึก','year',select('year',['R1','R2','R3'],r?.year||currentResident()?.year))}${field('ประเภท','type',select('type',['Rotation','Elective','Vacation','PL','บ้านแพ้ว'],r?.type||'Rotation'))}${field('หน่วยฝึก','unitId',select('unitId',[['','ไม่ระบุหน่วย'],...state.units.map(u=>[u.id,u.name])],r?.unitId||''))}${field('วันที่เริ่ม','start',input('start',r?.start||TODAY,'date','required'))}${field('วันที่สิ้นสุด','end',input('end',r?.end||monthEnd(TODAY.slice(0,7)),'date','required'))}${field('สายย่อย เช่น Cornea1','track',select('track',[['','ยังไม่กำหนด'],...new Set(Object.values(REVIEW_TRACKS).flat())],r?.track||''))}${field('สถานที่ / โรงพยาบาล','location',input('location',r?.location||''))}${field('หมายเหตุ','note',textArea('note',r?.note||''),'PL หมายถึง Personalized Learning',true)}</div><p class="review-note">เมื่อบันทึก จะเพิ่มการแจ้งเตือนถึงทีม Postgrad ในต้นแบบ การอนุมัติวันลาและการส่ง Email/LINE จริงยังไม่รวมในขั้นตอนนี้</p><div class="form-actions"><button type="button" class="btn" onclick="closeDialog()">ยกเลิก</button><button class="btn primary">บันทึกตาราง</button></div></form>`);
}
function saveSchedule(e,id){
  e.preventDefault();if(!reviewGuard(['chief']))return;
  const d=Object.fromEntries(new FormData(e.target));
  if(d.end<d.start){toast('วันสิ้นสุดต้องไม่ก่อนวันเริ่ม');return;}
  if(d.type==='Rotation'&&!d.unitId){toast('กรุณาเลือกหน่วยสำหรับ Rotation');return;}
  if(d.track&&!REVIEW_TRACKS[d.year]?.includes(d.track)){toast('สายย่อยไม่ตรงชั้นปีที่เลือก');return;}
  if(d.type==='Rotation'&&d.track&&!trackMatchesUnit(d.track,unitName(d.unitId))){toast('สายย่อยไม่ตรงกับหน่วยฝึก กรุณาตรวจหน่วยและทีมผู้รับ FEV-1');return;}
  const conflict=state.schedule.find(r=>r.id!==id&&r.residentId===d.residentId&&r.start<=d.end&&r.end>=d.start&&((r.type==='Rotation')===(d.type==='Rotation')));
  if(conflict){toast('ช่วงเวลาซ้อนกับรายการเดิม กรุณาตรวจตารางของ Resident คนนี้');return;}
  const old=state.schedule.find(r=>r.id===id);const scheduleId=id||reviewUID('ROT');
  if(old&&['start','end','unitId','residentId','type','year'].some(k=>old[k]!==d[k])){
    state.requests.filter(r=>r.rotationId===id&&r.status==='pending').forEach(r=>{r.status='cancelled';r.cancelReason='ตาราง Rotation ถูกแก้ไข ต้องสร้างงานจากตารางใหม่';});
  }
  const record={...d,id:scheduleId};if(old)Object.assign(old,record);else state.schedule.push(record);
  state.postgradStaffIds.forEach(staffId=>reviewNotice({key:reviewUID('schedule-change'),title:'มีการปรับตารางปฏิบัติงาน',text:`${scheduleResident(record)?.name} · ${record.type} · ${dateThai(record.start)} - ${dateThai(record.end)}`,role:'instructor',userId:staffId,url:'rotation'}));
  recordAudit('Chief Resident ปรับตาราง '+scheduleResident(record)?.name);runReviewAutomation(TODAY);closeDialog();render();toast('บันทึกตารางและเพิ่มการแจ้งเตือน Postgrad ในต้นแบบแล้ว');
}
function weeklyModal(year,track,day,session,ay=currentAcademicYear()){if(!reviewGuard(['chief']))return;const w=state.weeklySchedule.find(w=>w.academicYear===ay&&w.year===year&&w.track===track&&w.day===day&&w.session===session);
  openDialog(`${year} · ${track} · ${day} ${session}`,`<form onsubmit="saveWeekly(event,'${year}','${track}','${day}','${session}','${ay}')"><div class="form-grid">${field('งาน / คลินิก','task',input('task',w?.task||'','text','required'),'',true)}${field('เริ่มเวลา','start',input('start',w?.start||'','time'))}${field('สิ้นสุดเวลา','end',input('end',w?.end||'','time'))}${field('หมายเหตุ / สถานที่เพิ่มเติม','note',textArea('note',w?.note||''),'เช่น ลำดับงาน A/B หรือเวลาที่ต่างจากปกติ',true)}</div><div class="form-actions"><button class="btn" type="button" onclick="closeDialog()">ยกเลิก</button><button class="btn primary">บันทึกตารางสัปดาห์</button></div></form>`);
}

function runReviewAutomation(asOf){
  let created=0,reminded=0;
  for(const r of state.schedule.filter(r=>r.type==='Rotation'&&r.end<=asOf)){
    const u=scheduleResident(r),unit=state.units.find(u=>u.id===r.unitId);if(!u||!unit)continue;
    for(const staffId of unit.staffIds){
      const evaluator=staffName(staffId);if(!staffUsers().some(u=>u.id===staffId))continue;
      const key=[r.id,r.residentId,staffId,r.start,r.end,r.unitId,r.year].join('|');
      let req=state.requests.find(q=>q.rotationKey===key&&q.status!=='cancelled');
      if(!req){req={id:reviewUID('FEV'),residentId:u.id,name:u.name,year:r.year,academicYear:academicYearOf(r.end),form:'fev1',type:'FEV-1',title:'FEV-1 · '+unit.name,rotationId:r.id,rotationKey:key,rotationLabel:`${unit.name} · ${dateThai(r.start)} - ${dateThai(r.end)}`,date:r.end,procedureDate:null,createdDate:r.end,due:nextMonthDay(r.end,15),evaluator,staffId,status:'pending',automatic:true};state.requests.push(req);created++;reviewNotice({key:'new-'+req.id,title:'ได้รับแบบประเมิน FEV-1',text:`${u.name} · ${unit.name} · กำหนดส่ง ${dateThai(req.due)}`,role:'instructor',userId:staffId,date:r.end,url:'evaluate/'+req.id});}

    }
  }
  for(const req of state.requests.filter(q=>q.form==='fev1'&&q.status==='pending'&&q.due)){
    const staffId=req.staffId||staffUsers().find(u=>u.name===req.evaluator)?.id;if(!staffId)continue;
    for(const day of [5,10]){const date=req.due.slice(0,8)+String(day).padStart(2,'0'),key='reminder-'+req.id+'-'+day;if(date<=asOf&&(!req.createdDate||req.createdDate<=date)&&!state.reviewNotifications.some(n=>n.key===key)){reviewNotice({key,title:'เตือนประเมิน FEV-1 · วันที่ '+day,text:`${req.name} · ${req.rotationLabel||'รายการเดิม'} · กำหนดส่ง ${dateThai(req.due)}`,role:'instructor',userId:staffId,date,url:'evaluate/'+req.id});reminded++;}}
  }
  persist();return {created,reminded};
}

  const top=`<form class="review-toolbar" onsubmit="event.preventDefault();location.hash='${base}?tab=${tab}&year='+this.year.value">${field('ชั้นปี ณ วันที่ประเมิน','year',select('year',[['all','ทุกชั้นปี (รวมประวัติย้อนหลัง)'],'R1','R2','R3'],year))}<button class="btn primary">ดูผล</button>${btn('ประวัติทุกครั้ง',`history?resident=${u.id}`,'clock')}</form>`;
  let body='';
  if(tab==='fev'){
    const rows=assessments.filter(a=>a.form==='fev1').sort((a,b)=>b.date.localeCompare(a.date));
    const chosen=rows.find(a=>a.id===p.get('attempt'))||rows[0];
    body=`<section class="card pad"><div class="split-head"><h2>FEV-1 รายครั้ง</h2>${rows.length?`<select class="input" aria-label="เลือกผล FEV-1" onchange="location.hash='${base}?tab=fev&year=${year}&attempt='+this.value">${rows.map((a,i)=>option(a.id,`${dateThai(a.date)} · ${a.evaluator} · ${a.year}`,chosen?.id)).join('')}</select>`:''}</div>${fevRadar(chosen)}${chosen?`<div class="section-gap">${btn('ดูผลและ Feedback','assessment/'+chosen.id,'arrow','small')}</div>`:''}</section>${attemptCards(rows)}`;
  }else if(tab==='logbook'){
    const cases=residentCases(u.id).filter(c=>year==='all'||c.year===year);
    body=`<div class="stats">${stat('เคสที่บันทึก',cases.length,'ตามผู้เรียนและชั้นปีที่เลือก','book')}${stat('ครบจำนวนขั้นต่ำ',ACTIVITIES.filter((a,i)=>cases.filter(c=>+c.activity===i).length>=a[1]).length,'จาก 30 รายการ · แยกจากผลสอบ','chart')}</div><section class="card section-gap"><div class="card-head"><h2>ประสบการณ์หัตถการ</h2>${role==='resident'?btn('บันทึกหัตถการ','new-case','plus','primary'):''}</div><div class="card-body progress-list">${ACTIVITIES.map(([name,min],i)=>{const n=cases.filter(c=>+c.activity===i).length;return `<div><div class="progress-label"><span>${name}</span><strong>${n} / ${min}</strong></div><div class="progress"><span style="width:${Math.min(100,n/min*100)}%"></span></div></div>`;}).join('')}</div></section><div class="section-gap">${role==='resident'?btn('ดูบันทึกแต่ละเคส','logbook','book'):''}</div>`;
  }else{
    const allowed=tab==='epa'?['EPA','DOPS']:tab==='longcase'?['Long case']:['Skill Board'];
    const forms=FORMS.filter(f=>allowed.includes(f.type));
    body=`<div class="review-grid">${forms.map(f=>{const list=assessments.filter(a=>a.form===f.id).sort((a,b)=>b.date.localeCompare(a.date));const pending=state.requests.filter(r=>r.residentId===u.id&&r.form===f.id&&r.status==='pending'&&(year==='all'||r.year===year)).length;return `<section class="review-record"><div class="actions">${tag(shortFormCode(f.id),'blue')}${f.year?tag(f.year,'gray'):''}</div><h3>${esc(f.title)}</h3><div class="metric-row"><span>ประเมินแล้ว</span><strong>${list.length} ครั้ง</strong></div><div class="metric-row"><span>ผู้ประเมินต่างคน</span><strong>${new Set(list.map(a=>a.staffId||a.evaluator)).size} คน</strong></div><div class="metric-row"><span>รอประเมิน</span><strong>${pending} ครั้ง</strong></div>${list[0]?`<p class="small">ล่าสุด ${dateThai(list[0].date)} · ${statusTag(displayResult(list[0]))}</p>`:'<p class="small muted">ยังไม่มีผลประเมินในชั้นปีที่เลือก</p>'}<div class="actions">${btn('ประวัติ','history?resident='+u.id+'&form='+f.id,'clock','small')}${role==='resident'?btn('ขอประเมินอีกครั้ง','new-request?form='+f.id,'plus','small'):btn('ดูแบบประเมิน','form/'+f.id+'?resident='+u.id,'file','small')}</div></section>`;}).join('')}</div>`;
  }
  return head(forResidentId?esc(u.name):'E-portfolio',`${esc(u.year)} ปัจจุบัน · ประวัติแยกตามชั้นปีที่ประเมิน`,forResidentId?btn('กลับ Resident ที่ปรึกษา','residents','users'):'')+tabs+top+body+(forResidentId?`<div class="section-gap">${residentSummaryExtras(u.id)}</div>`:'');
}
function attemptCards(rows){return `<div class="review-list section-gap">${rows.map(a=>`<article class="review-record"><div class="actions">${tag(shortFormCode(a.form),'blue')}${tag(a.year,'gray')}${statusTag(displayResult(a))}</div><h3>${dateThai(a.date)} · ${esc(a.evaluator)}</h3><p>${esc(a.feedback)}</p>${btn('รายละเอียดรายครั้ง','assessment/'+a.id,'arrow','small')}</article>`).join('')}</div>`;}
function examsPage(forResidentId){
  const p=reviewParams(),ay=p.get('ay')||(forResidentId?'all':currentAcademicYear()),yr=p.get('year')||'all';
  const selectedId=forResidentId||(role==='resident'?currentResident()?.id:p.get('resident')||'all');
  const sessions=state.examSessions.filter(s=>(ay==='all'||s.academicYear===ay)&&(yr==='all'||s.year===yr)).sort((a,b)=>b.date.localeCompare(a.date));
  const rows=sessions.filter(s=>role!=='resident'||s.year===currentResident()?.year||state.examResults.some(r=>r.sessionId===s.id&&r.residentId===selectedId));
  const mayOwn=state.settings.examResidentEntry===true;
  const cards=rows.map(s=>{const results=state.examResults.filter(r=>r.sessionId===s.id&&(selectedId==='all'||r.residentId===selectedId));const records=selectedId==='all'?results:[results[0]||{residentId:selectedId,status:'ยังไม่บันทึก',score:null}];return `<section class="review-record"><div class="actions">${tag(s.year,'blue')}${tag(s.type,'teal')}</div><h3>${s.type} ครั้งที่ ${esc(s.round)} · ปีการศึกษา ${esc(s.academicYear)}</h3><p class="small muted">${dateThai(s.date)} · คะแนนเต็ม ${s.max}</p><div class="exam-stats"><span>Mean ${s.mean??'—'}</span><span>Min ${s.min??'—'}</span><span>Max ${s.maxScore??'—'}</span></div><p class="small muted">ค่าสถิติร่วมของชั้นปีนี้ในรอบสอบเดียวกัน กรอกและแก้ไขจากรอบสอบครั้งเดียว</p>${records.map(r=>`<div class="metric-row"><span>${esc(state.users.find(u=>u.id===r.residentId)?.name||'ผู้เรียน')}</span><span>${r.status==='สอบแล้ว'?`<strong class="score-pill">${r.score}</strong> / ${s.max}`:tag(r.status,'orange')}</span></div>`).join('')||'<p class="small muted">ยังไม่มีผลรายบุคคล</p>'}<div class="actions">${role==='admin'?`<button class="btn small" onclick="examSessionModal('${s.id}')">แก้ไขรอบและสถิติ</button><button class="btn primary small" onclick="examResultModal('${s.id}')">ลงคะแนนรายคน</button>`:role==='resident'&&mayOwn?`<button class="btn primary small" onclick="examResultModal('${s.id}','${selectedId}')">บันทึกผลของฉัน</button>`:''}</div></section>`;}).join('');
  if(forResidentId)return `<section class="card pad"><h2>ผลการสอบ</h2><div class="review-grid section-gap">${cards||'<p>ยังไม่มีผลสอบ</p>'}</div></section>`;
  return head('ผลการสอบ','Pre-test, Post-test และ Final แยกชั้นปีและรอบสอบ',role==='admin'?`<button class="btn primary" onclick="examSessionModal()">${icon('plus')}เพิ่มรอบสอบ</button>`:'')+`<form class="review-toolbar" onsubmit="filterExams(event)">${field('ปีการศึกษา','ay',input('ay',ay,'number','required min="2500" max="2700"'))}${field('ชั้นปีที่สอบ','year',select('year',[['all','ทุกชั้นปี'],'R1','R2','R3'],yr))}${role!=='resident'?field('Resident','resident',select('resident',[['all','ทุกคน'],...residentUsers().map(u=>[u.id,u.name])],selectedId)):''}<button class="btn primary">แสดงผล</button></form><p class="review-note">Elective, Vacation และการไม่ได้สอบจะแสดงสถานะแยก โดยไม่แทนด้วยคะแนน 0</p><div class="review-grid">${cards||empty('ยังไม่มีรอบสอบที่ตรงกับตัวกรอง','ผู้ดูแลสามารถเพิ่มรอบสอบและค่าสถิติได้')}</div>`;
}
function filterExams(e){e.preventDefault();location.hash='exams?'+new URLSearchParams(new FormData(e.target)).toString();}
function examSessionModal(id){if(!reviewGuard(['admin']))return;const s=state.examSessions.find(s=>s.id===id);openDialog(s?'แก้ไขรอบสอบและสถิติ':'เพิ่มรอบสอบ',`<form onsubmit="saveExamSession(event,'${s?.id||''}')"><div class="form-grid">${field('ปีการศึกษา','academicYear',input('academicYear',s?.academicYear||currentAcademicYear(),'number','required min="2500" max="2700"'))}${field('ชั้นปี','year',select('year',['R1','R2','R3'],s?.year||'R1'))}${field('ประเภท','type',select('type',['Pre-test','Post-test','Final'],s?.type||'Pre-test'))}${field('ครั้งที่','round',input('round',s?.round||'1','number','required min="1" step="1"'))}${field('วันที่สอบ','date',input('date',s?.date||TODAY,'date','required'))}${field('คะแนนเต็ม','max',input('max',s?.max||100,'number','required min="1" step="0.01"'))}${field('Mean ของชั้นปี','mean',input('mean',s?.mean??'','number','min="0" step="0.01"'))}${field('Min ของชั้นปี','min',input('min',s?.min??'','number','min="0" step="0.01"'))}${field('Max ของชั้นปี','maxScore',input('maxScore',s?.maxScore??'','number','min="0" step="0.01"'))}</div><p class="review-note">ค่าสถิติหนึ่งชุดต่อปีการศึกษา + ชั้นปี + ประเภท + ครั้งที่ ไม่ต้องกรอกซ้ำในผลของผู้เรียนแต่ละคน</p><div class="form-actions"><button type="button" class="btn" onclick="closeDialog()">ยกเลิก</button><button class="btn primary">บันทึกรอบสอบ</button></div></form>`);}
function saveExamSession(e,id){e.preventDefault();if(!reviewGuard(['admin']))return;const d=Object.fromEntries(new FormData(e.target));const ay=Number(d.academicYear),round=Number(d.round);if(!Number.isInteger(ay)||ay<2500||ay>2700||!Number.isInteger(round)||round<1){toast('ปีการศึกษาและครั้งที่ต้องเป็นจำนวนเต็มที่ถูกต้อง');return;}d.academicYear=String(ay);d.round=String(round);for(const k of ['max','mean','min','maxScore'])d[k]=d[k]===''?null:Number(d[k]);if(!Number.isFinite(d.max)||d.max<=0||['mean','min','maxScore'].some(k=>d[k]!==null&&!Number.isFinite(d[k]))){toast('กรอกคะแนนเต็มและค่าสถิติเป็นตัวเลขที่ถูกต้อง');return;}if(state.examSessions.some(s=>s.id!==id&&Number(s.academicYear)===ay&&Number(s.round)===round&&s.year===d.year&&s.type===d.type)){toast('มีรอบสอบนี้แล้ว กรุณาแก้ไขรายการเดิมเพื่อใช้สถิติชุดเดียวกัน');return;}if(['mean','min','maxScore'].some(k=>d[k]!=null&&(d[k]<0||d[k]>d.max))||(d.min!=null&&d.maxScore!=null&&d.min>d.maxScore)||(d.mean!=null&&((d.min!=null&&d.mean<d.min)||(d.maxScore!=null&&d.mean>d.maxScore)))){toast('ตรวจค่าสถิติ: Min ≤ Mean ≤ Max และไม่เกินคะแนนเต็ม');return;}if(id&&state.examResults.some(r=>r.sessionId===id&&r.score!=null&&r.score>d.max)){toast('คะแนนเต็มใหม่ต่ำกว่าคะแนนที่บันทึกไว้');return;}const old=state.examSessions.find(s=>s.id===id);if(old)Object.assign(old,d);else state.examSessions.push({...d,id:reviewUID('EX')});recordAudit('บันทึกรอบสอบและสถิติ '+d.type);closeDialog();location.hash='exams?ay='+d.academicYear;render();toast('บันทึกรอบสอบแล้ว');}
function examResultModal(sessionId,residentId){if(!reviewGuard(state.settings.examResidentEntry?['admin','resident']:['admin']))return;const s=state.examSessions.find(s=>s.id===sessionId),rid=role==='resident'?currentResident()?.id:residentId||residentUsers().find(u=>u.year===s?.year)?.id||residentUsers()[0]?.id;if(!s||!rid){toast('ยังไม่มี Resident ในชั้นปีนี้');return;}const r=state.examResults.find(r=>r.sessionId===sessionId&&r.residentId===rid);const options=role==='resident'?[currentResident()]:residentUsers();openDialog(`ผล ${s.type} ครั้งที่ ${s.round} · ${s.year}`,`<form onsubmit="saveExamResult(event,'${s.id}')"><div class="form-grid">${field('Resident','residentId',select('residentId',options.map(u=>[u.id,u.name+' · ปัจจุบัน '+u.year]),rid,true,role==='admin'?`onchange="examResultModal('${sessionId}',this.value)"`:''))}${field('สถานะการสอบ','status',select('status',['สอบแล้ว','ไม่ได้สอบ - Elective','ไม่ได้สอบ - Vacation','ไม่ได้สอบ - อื่น ๆ'],r?.status||'สอบแล้ว',true,'onchange="toggleExamScore(this.value)"'))}${field('คะแนน','score',input('score',r?.score??'','number',`min="0" max="${s.max}" step="0.01" ${!r||r.status==='สอบแล้ว'?'required':'disabled'}`),'ไม่กรอกคะแนนเมื่อไม่ได้สอบ · การลงผลย้อนหลังให้เลือกผู้เรียนที่อยู่ชั้นปีนี้ในรอบสอบนั้น')}${field('หมายเหตุ','note',textArea('note',r?.note||''),'',true)}</div><div class="form-actions"><button type="button" class="btn" onclick="closeDialog()">ยกเลิก</button><button class="btn primary">บันทึกผลสอบ</button></div></form>`);}
function toggleExamScore(status){const el=document.getElementById('score');el.disabled=status!=='สอบแล้ว';el.required=status==='สอบแล้ว';if(el.disabled)el.value='';}
function saveExamResult(e,sessionId){e.preventDefault();if(!reviewGuard(state.settings.examResidentEntry?['admin','resident']:['admin']))return;const d=Object.fromEntries(new FormData(e.target)),s=state.examSessions.find(s=>s.id===sessionId);if(!s)return;if(role==='resident')d.residentId=currentResident().id;if(!residentUsers().some(u=>u.id===d.residentId))return;if(d.status==='สอบแล้ว'&&(d.score===undefined||String(d.score).trim()==='')){toast('กรอกคะแนน หรือเลือกสถานะไม่ได้สอบ');return;}d.score=d.status==='สอบแล้ว'?Number(d.score):null;if(d.status==='สอบแล้ว'&&(!Number.isFinite(d.score)||d.score<0||d.score>s.max)){toast('คะแนนต้องอยู่ในช่วงคะแนนเต็มของรอบสอบ');return;}const r=state.examResults.find(r=>r.sessionId===sessionId&&r.residentId===d.residentId);if(r)Object.assign(r,d);else state.examResults.push({...d,id:reviewUID('ER'),sessionId});recordAudit('บันทึกผลสอบรายคน '+s.type);closeDialog();render();toast('บันทึกผลรายคนแล้ว ค่าสถิติร่วมยังเป็นชุดเดิม');}
function researchPage(residentId){const rid=residentId||(role==='resident'?currentResident()?.id:reviewParams().get('resident')||residentUsers()[0]?.id);const u=state.users.find(u=>u.id===rid);const projects=state.researchProjects.filter(p=>p.residentId===rid);const own=role==='resident'&&rid===currentResident()?.id;const body=`<div class="review-list">${projects.map(p=>`<section class="card pad"><div class="split-head"><div><h2>${esc(p.title)}</h2><p class="small muted">ที่ปรึกษา ${esc(p.advisorId?staffName(p.advisorId):p.legacyAdvisor||'ยังไม่กำหนด')}</p></div>${own?`<button class="btn" onclick="researchProjectModal('${p.id}')">แก้ไขชื่องานวิจัย</button>`:''}</div>${p.needsProjectTitle?'<p class="review-note">ย้ายมาจากบันทึกเดิม ชื่อข้างต้นเป็นชื่อบันทึก กรุณาปรับเป็นชื่องานวิจัยเมื่อยืนยันแล้ว</p>':''}${own?`<button class="btn primary" onclick="researchUpdateModal('${p.id}')">${icon('plus')}รายงานความก้าวหน้า</button>`:''}<div class="section-gap">${[...p.updates].sort((a,b)=>b.date.localeCompare(a.date)).map(up=>`<article class="timeline-record"><p class="small muted">${dateThai(up.date)}</p><h3>${esc(up.stage)}</h3><p>${esc(up.progress)}</p>${up.next?`<p><strong>ขั้นต่อไป:</strong> ${esc(up.next)}</p>`:''}${up.note?`<p class="small muted">${esc(up.note)}</p>`:''}</article>`).join('')||'<p class="muted">ยังไม่มีรายงานความก้าวหน้า</p>'}</div></section>`).join('')||empty('ยังไม่มีข้อมูลงานวิจัย','เพิ่มชื่องานวิจัยแล้วรายงานความก้าวหน้าได้หลายครั้ง')}</div>`;if(residentId)return `<h2 class="section-gap">งานวิจัย</h2><div class="section-gap">${body}</div>`;return head('งานวิจัย',esc(u?.name||''),own?`<button class="btn primary" onclick="researchProjectModal()">${icon('plus')}เพิ่มงานวิจัย</button>`:'')+(role!=='resident'?`<label for="research-resident">Resident</label>${select('research-resident',residentUsers().map(u=>[u.id,u.name]),rid,false,'onchange="location.hash=\'research?resident=\'+this.value"')}`:'')+body;}
function researchProjectModal(id){if(!reviewGuard(['resident']))return;const p=state.researchProjects.find(p=>p.id===id);if(p&&p.residentId!==currentResident()?.id)return;openDialog(p?'แก้ไขชื่องานวิจัย':'เพิ่มงานวิจัย',`<form onsubmit="saveResearchProject(event,'${p?.id||''}')">${field('ชื่องานวิจัย','title',input('title',p?.title||'','text','required'))}${field('อาจารย์ที่ปรึกษาวิจัย','advisorId',select('advisorId',staffUsers().map(u=>[u.id,u.name]),p?.advisorId||'T001',true))}<div class="form-actions"><button type="button" class="btn" onclick="closeDialog()">ยกเลิก</button><button class="btn primary">บันทึกงานวิจัย</button></div></form>`);}
function saveResearchProject(e,id){e.preventDefault();if(!reviewGuard(['resident']))return;const d=Object.fromEntries(new FormData(e.target)),p=state.researchProjects.find(p=>p.id===id);if(p){if(p.residentId!==currentResident()?.id)return;Object.assign(p,d,{needsProjectTitle:false});}else state.researchProjects.push({...d,id:reviewUID('RP'),residentId:currentResident().id,updates:[]});recordAudit('บันทึกชื่องานวิจัย');closeDialog();render();toast('บันทึกงานวิจัยแล้ว');}

function adminResultMatrix(year='all',ay='all'){
  const assessments=state.assessments.filter(a=>['EPA','DOPS'].includes(formById(a.form)?.type)&&(ay==='all'||a.academicYear===ay));
  const requests=state.requests.filter(r=>['EPA','DOPS'].includes(formById(r.form)?.type)&&r.status==='pending'&&(ay==='all'||(r.academicYear||academicYearOf(r.date))===ay));

  const groups=years.map(y=>({year:y,forms:FORMS.filter(f=>{

    const range=String(f.year||'').replace(/[–—]/g,'-').match(/R(\d)(?:-R?(\d))?/),n=Number(y.slice(1));
    const listed=range&&n>=Number(range[1])&&n<=Number(range[2]||range[1]);

  })}));
  const residents=state.users.filter(u=>u.role==='resident'&&(u.active||assessments.some(a=>a.residentId===u.id)||requests.some(r=>r.residentId===u.id)));
  function cell(u,f,y){
    const results=assessments.filter(a=>a.residentId===u.id&&a.form===f.id&&a.year===y).sort((a,b)=>b.date.localeCompare(a.date));
